<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Leaderboard - AFIT CBT Simulator</title>
    
    <link rel="icon" type="image/svg+xml" href="../static/img/afitcbtsim-logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/main.css">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        html, body { max-width: 100vw; overflow-x: hidden; margin: 0; padding: 0; }
        *, *::before, *::after { box-sizing: border-box; }

        body { 
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); 
            color: #f8fafc; font-family: 'Poppins', sans-serif; 
            min-height: 100vh;
        }

        .nav-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.2rem 5%; background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky; top: 0; z-index: 100;
        }

        .nav-logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.1rem; color: white; }
        .nav-logo img { width: 32px; height: 32px; border-radius: 8px; }

        .btn-back {
            background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2);
            padding: 0.5rem 1rem; border-radius: 8px; font-weight: 600; cursor: pointer;
            transition: all 0.2s; font-family: 'Poppins', sans-serif; font-size: 0.85rem;
        }
        .btn-back:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }

        .leaderboard-container { max-width: 950px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem 1.5rem; text-align: center; }

        .hero-title { font-size: 2.2rem; font-weight: 900; margin: 0 0 8px 0; text-transform: uppercase; letter-spacing: 0.5px; color: white; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .hero-subtitle { color: #93c5fd; font-size: 0.95rem; font-weight: 500; margin: 0 0 2.5rem 0; }

        /* 🚀 TOP 3 PODIUM */
        .podium-wrapper { 
            display: flex; justify-content: center; align-items: flex-end; 
            gap: 16px; margin: 0 auto 3.5rem auto; min-height: 270px; max-width: 600px;
        }
        
        .podium-step {
            background: white; color: #0f172a; border-radius: 20px 20px 16px 16px;
            width: 175px; padding: 1.5rem 1rem 1.2rem 1rem; position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); display: flex; flex-direction: column; justify-content: flex-start;
            transition: transform 0.3s;
        }
        .podium-step:hover { transform: translateY(-5px); }
        
        .step-1 { height: 250px; border-top: 8px solid #fbbf24; z-index: 3; order: 2; } /* Gold Center */
        .step-2 { height: 210px; border-top: 8px solid #94a3b8; z-index: 2; order: 1; } /* Silver Left */
        .step-3 { height: 180px; border-top: 8px solid #d97706; z-index: 1; order: 3; } /* Bronze Right */

        .p-rank {
            position: absolute; top: -24px; left: 50%; transform: translateX(-50%);
            width: 48px; height: 48px; border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-weight: 900; font-size: 1.3rem; color: white; box-shadow: 0 8px 16px rgba(0,0,0,0.25);
        }
        .step-1 .p-rank { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); font-size: 1.6rem; width: 56px; height: 56px; top: -28px; }
        .step-2 .p-rank { background: linear-gradient(135deg, #94a3b8 0%, #64748b 100%); }
        .step-3 .p-rank { background: linear-gradient(135deg, #d97706 0%, #92400e 100%); }

        .p-name { font-weight: 800; font-size: 1rem; margin-top: 24px; line-height: 1.2; word-break: break-word; color: #0f172a; }
        .step-1 .p-name { font-size: 1.15rem; margin-top: 30px; }
        .p-course { font-size: 0.7rem; color: #64748b; font-weight: 700; margin-top: 4px; text-transform: uppercase; line-height: 1.3; }
        .p-score { font-size: 1.6rem; font-weight: 900; color: #2563eb; margin-top: auto; padding-top: 8px; }
        .p-putme { font-size: 0.72rem; color: #64748b; font-weight: 700; }

        /* 🚀 TABLE STYLES */
        .table-card {
            background: white; border-radius: 20px; overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
        }
        
        .rank-table { width: 100%; border-collapse: collapse; text-align: left; }
        .rank-table th { background: #f8fafc; color: #475569; font-weight: 800; text-transform: uppercase; font-size: 0.75rem; padding: 1.1rem 1.2rem; border-bottom: 2px solid #e2e8f0; }
        .rank-table td { padding: 1.1rem 1.2rem; border-bottom: 1px solid #f1f5f9; color: #334155; font-size: 0.9rem; font-weight: 600; vertical-align: middle; }
        .rank-table tr:hover td { background: #f8fafc; }
        
        .rank-badge {
            background: #f1f5f9; color: #64748b; padding: 4px 10px; border-radius: 6px; font-weight: 800; font-size: 0.8rem; display: inline-block;
        }
        .score-highlight { color: #2563eb; font-weight: 900; font-size: 1.05rem; }

        .empty-state { padding: 4rem 1.5rem; text-align: center; color: #94a3b8; }
        #loading-spinner { display: flex; flex-direction: column; align-items: center; padding: 4rem 0; color: white; }

        /* 🚀 MOBILE RESPONSIVENESS */
        @media (max-width: 650px) {
            .hero-title { font-size: 1.6rem; }
            .hero-subtitle { font-size: 0.85rem; margin-bottom: 2rem; }
            .leaderboard-container { padding: 1.5rem 1rem 3rem 1rem; }

            .podium-wrapper { 
                flex-direction: column; align-items: center; 
                gap: 16px; min-height: auto; margin-bottom: 2.5rem; width: 100%;
            }
            .podium-step { 
                width: 100%; max-width: 100%; height: auto !important; 
                padding: 1.2rem 1.2rem; border-top: none; border-left: 6px solid; 
                border-radius: 14px; flex-direction: row; align-items: center; text-align: left;
                order: initial !important;
            }
            .step-1 { border-left-color: #fbbf24; }
            .step-2 { border-left-color: #94a3b8; }
            .step-3 { border-left-color: #d97706; }

            .p-rank { 
                position: static; transform: none; width: 40px !important; height: 40px !important; 
                font-size: 1.1rem !important; margin-right: 14px; flex-shrink: 0; box-shadow: none;
            }
            .podium-step-info { flex-grow: 1; min-width: 0; }
            .p-name { margin-top: 0 !important; font-size: 0.95rem !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .p-course { margin-top: 2px; font-size: 0.68rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .p-score-box { text-align: right; flex-shrink: 0; margin-left: 10px; }
            .p-score { margin-top: 0; font-size: 1.3rem; padding-top: 0; }
            .p-putme { font-size: 0.65rem; }

            .rank-table th, .rank-table td { padding: 0.9rem 0.6rem; font-size: 0.8rem; }
            .hide-mobile { display: none; }
        }
    </style>
</head>
<body>

    <nav class="nav-header">
        <div class="nav-logo">
            <img src="../static/img/afitcbtsim-logo.png" alt="Logo">
            AFIT CBT SIM
        </div>
        <button onclick="window.history.back()" class="btn-back">← Go Back</button>
    </nav>

    <div class="leaderboard-container">
        <h1 class="hero-title">Official Leaderboard</h1>
        <p class="hero-subtitle">August 17th Mock Examination Rankings</p>

        <div id="loading-spinner">
            <svg class="animate-spin" style="width: 45px; height: 45px; color: #38bdf8; margin-bottom: 12px;" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <h3>Compiling Live Rankings...</h3>
        </div>

        <div id="leaderboard-content" style="display: none;">
            
            <!-- 🏆 TOP 3 PODIUM -->
            <div class="podium-wrapper" id="podium-container"></div>

            <!-- 📋 RANKINGS TABLE -->
            <div class="table-card">
                <table class="rank-table">
                    <thead>
                        <tr>
                            <th style="width: 60px; text-align: center;">Rank</th>
                            <th>Aspirant Name</th>
                            <th class="hide-mobile">Course</th>
                            <th style="text-align: center;">Post-UTME</th>
                            <th style="text-align: right;">Aggregate</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>

        </div>
    </div>

    <!-- Ensure Supabase loads -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../static/app.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", fetchLeaderboard);

        async function fetchLeaderboard() {
            try {
                // Fetch all mock results
                const { data, error } = await supabaseClient
                    .from('mock_17_results')
                    .select('full_name, total_score, breakdown')
                    .order('submitted_at', { ascending: true });

                if (error) throw error;

                if (!data || data.length === 0) {
                    document.getElementById('loading-spinner').innerHTML = `
                        <div class="empty-state">
                            <h2 style="color: white; margin-bottom: 5px;">Waiting for submissions...</h2>
                            <p style="color: #93c5fd; margin: 0;">No aspirants have submitted the mock exam yet.</p>
                        </div>
                    `;
                    return;
                }

                // Sort by Aggregate DESC, then Post-UTME score DESC
                data.sort((a, b) => {
                    const aggA = a.breakdown?.calculated_aggregate || 0;
                    const aggB = b.breakdown?.calculated_aggregate || 0;
                    if (aggB !== aggA) return aggB - aggA;
                    return (b.total_score || 0) - (a.total_score || 0);
                });

                renderLeaderboard(data);

            } catch (err) {
                console.error("Leaderboard Error:", err);
                document.getElementById('loading-spinner').innerHTML = `
                    <div class="empty-state" style="color: #fca5a5;">
                        <h2>Error loading rankings.</h2>
                        <p>Please check your connection and refresh.</p>
                    </div>
                `;
            }
        }

        function renderLeaderboard(data) {
            document.getElementById('loading-spinner').style.display = 'none';
            document.getElementById('leaderboard-content').style.display = 'block';

            const top3 = data.slice(0, 3);
            const rest = data.slice(3);

            const podiumContainer = document.getElementById('podium-container');
            let podiumHtml = "";

            // Rank 2 (Silver) - Order 1 (Desktop Left)
            if (top3[1]) podiumHtml += createPodiumStep(top3[1], 2, 'step-2');
            
            // Rank 1 (Gold) - Order 2 (Desktop Center)
            if (top3[0]) podiumHtml += createPodiumStep(top3[0], 1, 'step-1');
            
            // Rank 3 (Bronze) - Order 3 (Desktop Right)
            if (top3[2]) podiumHtml += createPodiumStep(top3[2], 3, 'step-3');

            podiumContainer.innerHTML = podiumHtml;

            if (top3.length > 0) {
                setTimeout(() => {
                    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#fbbf24', '#94a3b8', '#d97706', '#2563eb'] });
                }, 400);
            }

            // Table for Ranks 4+
            const tbody = document.getElementById('table-body');
            if (rest.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#94a3b8; padding:2.5rem 1rem;">All participating aspirants are shown on the podium above.</td></tr>`;
            } else {
                let tableHtml = "";
                rest.forEach((user, index) => {
                    const rank = index + 4;
                    const name = user.full_name || 'Aspirant';
                    const rawCourse = user.breakdown?.course || 'General Assessment';
                    const cleanCourse = rawCourse.replace(/\[.*?\]/g, '').trim();
                    const aggregate = (user.breakdown?.calculated_aggregate || 0).toFixed(1) + '%';
                    const putme = (user.total_score || 0) + '/50';

                    tableHtml += `
                        <tr>
                            <td style="text-align: center;"><span class="rank-badge">#${rank}</span></td>
                            <td style="font-weight: 800; color: #0f172a;">${name}</td>
                            <td class="hide-mobile" style="color: #64748b; font-size: 0.78rem; text-transform: uppercase;">${cleanCourse}</td>
                            <td style="text-align: center; color: #64748b;">${putme}</td>
                            <td style="text-align: right;"><span class="score-highlight">${aggregate}</span></td>
                        </tr>
                    `;
                });
                tbody.innerHTML = tableHtml;
            }
        }

        function createPodiumStep(user, rank, stepClass) {
            const firstName = user.full_name ? user.full_name.trim().split(/\s+/)[0] : 'Aspirant';
            const rawCourse = user.breakdown?.course || 'AFIT Aspirant';
            const cleanCourse = rawCourse.replace(/\[.*?\]/g, '').trim();
            const aggregate = (user.breakdown?.calculated_aggregate || 0).toFixed(1) + '%';
            const putme = (user.total_score || 0) + '/50';

            return `
                <div class="podium-step ${stepClass}">
                    <div class="p-rank">${rank}</div>
                    <div class="podium-step-info">
                        <div class="p-name">${firstName}</div>
                        <div class="p-course">${cleanCourse}</div>
                    </div>
                    <div class="p-score-box">
                        <div class="p-score">${aggregate}</div>
                        <div class="p-putme">P-UTME: ${putme}</div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
