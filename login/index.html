<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Brightsitedev CBT</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../static/main.css">
</head>
<body class="auth-page">

    <div class="auth-split-layout">
        
        <div class="auth-banner">
            <div class="banner-content">
                <h2>Your Journey to Success Starts Here.</h2>
                <p>Join hundreads of aspirants preparing smarter, faster, and better for the Post-UTME. Master your subjects with our time-bound CBT engine.</p>
                
                <div class="banner-graphic">
                    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                      <path fill="#ffffff" fill-opacity="0.15" d="M44.7,-76.4C58.8,-69.2,71.8,-59.1,81.6,-46.3C91.4,-33.5,98,-18,97.4,-2.9C96.9,12.2,89.1,26.9,79.5,39.6C69.9,52.3,58.4,63,45.1,70.5C31.8,78,16.7,82.3,1.3,80.1C-14.1,77.9,-28.2,69.2,-41.8,61.1C-55.4,53,-68.5,45.5,-76.7,33.9C-84.9,22.3,-88.2,6.6,-86.2,-8.4C-84.2,-23.4,-76.9,-37.6,-66.5,-48.6C-56.1,-59.6,-42.6,-67.4,-29.4,-73.4C-16.2,-79.4,-3.3,-83.6,10.6,-82.1C24.5,-80.6,30.6,-83.6,44.7,-76.4Z" transform="translate(100 100) scale(1.1)" />
                    </svg>
                </div>
            </div>
        </div>

        <div class="auth-form-container">
            <div class="auth-form-wrapper">
                
                <div class="auth-logo">
                    <img src="../static/img/logo.jpg" alt="Brightsitedev Logo">
                </div>
                
                <h2 class="auth-title">Welcome, Aspirant</h2>
                <p class="auth-subtitle">Enter your email to receive a secure, passwordless login code.</p>

                <form id="email-form" onsubmit="requestOTP(event)">
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="name@example.com" maxlength="60" required>
                    </div>
                    <button type="submit" id="request-btn" class="auth-btn">Continue with Email</button>
                </form>

                <form id="otp-form" class="hidden" onsubmit="verifyOTP(event)">
                    <div class="input-group">
                        <label for="otp">Enter 6-Digit Code</label>
                        <input type="text" id="otp" placeholder="123456" pattern="[0-9]*" maxlength="8" required style="letter-spacing: 5px; font-size: 1.2rem; text-align: center; font-weight: 600;">
                    </div>
                    <button type="submit" id="verify-btn" class="auth-btn">Verify & Secure Login</button>
                </form>

                <div id="auth-message"></div>
                
                <div class="auth-footer">
                    <p>Secured by <strong>Supabase</strong> Enterprise Auth</p>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../static/app.js"></script>
    <script>
        // Smart Redirect Logic
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) window.location.href = '../dashboard/index.html';
        });
    </script>
</body>
</html>
