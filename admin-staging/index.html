<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Manager - AFIT CBT</title>
    
    <link rel="icon" type="image/svg+xml" href="../static/img/afitcbtsim-logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/main.css">
    
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true },
            options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre'] }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        body { background-color: #f1f5f9; color: #0f172a; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
        
        .admin-nav {
            height: 60px; background: #0f172a; color: white; display: flex; justify-content: space-between; align-items: center;
            padding: 0 1.5rem; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        .manager-wrapper { max-width: 1200px; margin: 1.5rem auto; padding: 0 1rem; }

        .stats-scroll-container {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 1.5rem;
        }
        .stats-scroll-container::-webkit-scrollbar { height: 6px; }
        .stats-scroll-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        .stat-pill {
            background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px 15px;
            display: flex; flex-direction: column; align-items: center; min-width: 100px; flex-shrink: 0;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border-top: 3px solid #2563eb;
        }
        .stat-pill span { font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 2px;}
        .stat-pill strong { font-size: 1.3rem; font-weight: 800; color: #0f172a; }

        .tabs-container { display: flex; gap: 10px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 1.5rem; overflow-x: auto;}
        .tab-btn {
            background: transparent; border: none; padding: 0.6rem 1rem; font-family: 'Poppins'; font-weight: 700;
            font-size: 0.95rem; color: #64748b; cursor: pointer; border-radius: 8px; transition: all 0.2s; white-space: nowrap;
        }
        .tab-btn:hover { background: #f1f5f9; color: #0f172a; }
        .tab-btn.active { background: #2563eb; color: white; }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .staging-layout { display: grid; grid-template-columns: 350px 1fr; gap: 1.5rem; align-items: start; }
        
        .panel-card { background: white; padding: 1.5rem; border-radius: 20px; border: 1px solid #e2e8f0; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05); }
        
        .input-group label { display: block; font-size: 0.8rem; font-weight: 700; color: #64748b; margin-bottom: 6px; text-transform: uppercase; }
        .input-group select, .input-group input { width: 100%; padding: 0.8rem 1rem; border-radius: 10px; border: 2px solid #e2e8f0; font-family: 'Poppins'; margin-bottom: 1.5rem; font-size: 0.95rem; box-sizing: border-box; }
        .input-group input:focus, .input-group select:focus { outline: none; border-color: #2563eb; }

        .btn { width: 100%; padding: 0.9rem; border-radius: 10px; font-weight: 700; border: none; cursor: pointer; font-size: 0.95rem; transition: transform 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn:hover { transform: translateY(-2px); }
        .btn-blue { background: #2563eb; color: white; }
        .btn-green { background: #16a34a; color: white; }
        .btn-red { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .btn-orange { background: #fff7ed; color: #ea580c; border: 1px solid #fed7aa; }

        .question-card { border: 2px solid #e2e8f0; border-radius: 16px; padding: 1.5rem; background: #f8fafc; }
        .q-meta { display: flex; justify-content: space-between; font-weight: 700; color: #64748b; border-bottom: 2px solid #e2e8f0; padding-bottom: 1rem; margin-bottom: 1.5rem; text-transform: uppercase; font-size: 0.85rem;}
        .q-text { font-size: 1.1rem; font-weight: 500; margin-bottom: 1.5rem; line-height: 1.6;}
        
        .option-box { display: flex; align-items: center; padding: 0.8rem 1.2rem; background: white; border: 2px solid #e2e8f0; border-radius: 12px; margin-bottom: 0.8rem; font-size: 0.9rem;}
        .option-box.correct-ans { background: #dcfce7; border-color: #16a34a; }
        .opt-letter { width: 28px; height: 28px; border-radius: 50%; background: #e2e8f0; display: flex; justify-content: center; align-items: center; font-weight: 800; margin-right: 12px; color: #475569; flex-shrink: 0;}
        .option-box.correct-ans .opt-letter { background: #16a34a; color: white; }

        @media (max-width: 900px) {
            .staging-layout { grid-template-columns: 1fr; }
            .q-meta { flex-direction: column; align-items: flex-start; gap: 8px; }
            .admin-nav { padding: 0 1rem; }
        }
    </style>
</head>
<body>

    <nav class="admin-nav">
        <div style="font-weight: 800; font-size: 1.1rem;">Bank Manager</div>
        <button onclick="window.location.href='../admin/index.html'" style="background: #334155; color: white; border: none; padding: 0.5rem 1rem; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.85rem;">← Dashboard</button>
    </nav>

    <div class="manager-wrapper">
        
        <div>
            <h3 style="margin: 0 0 10px 0; font-size: 1.1rem; color: #0f172a;">Live Bank Stats</h3>
            <div class="stats-scroll-container" id="stats-container">
                <div class="stat-pill"><span>Loading...</span><strong>-</strong></div>
            </div>
        </div>

        <div class="tabs-container">
            <button class="tab-btn active" onclick="switchTab('tab-editor')">✏️ Editor & Search</button>
            <button class="tab-btn" onclick="switchTab('tab-staging')">📥 ALOC Pull Engine</button>
        </div>

        <!-- ========================================== -->
        <!-- TAB 1: QUESTION EDITOR & SEARCH MANAGER    -->
        <!-- ========================================== -->
        <div id="tab-editor" class="tab-panel active">
            <div class="panel-card" style="max-width: 700px; margin: 0 auto;">
                <h3 style="margin-top:0; color: #0f172a; font-size: 1.3rem;">Search & Edit Question</h3>
                <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 1.5rem;">Find a question by its 4-character short ID.</p>
                
                <div style="display: flex; gap: 10px; margin-bottom: 1.5rem;">
                    <input type="text" id="search-id-input" placeholder="e.g. X8B2" style="flex-grow: 1; padding: 0.8rem 1rem; border-radius: 10px; border: 2px solid #e2e8f0; font-family: 'Poppins'; font-size: 1rem; text-transform: uppercase;" maxlength="5">
                    <button class="btn btn-blue" style="width: auto; padding: 0 1.5rem;" onclick="searchQuestion()" id="search-btn">Search</button>
                </div>

                <div id="search-error" style="color: #dc2626; font-weight: 600; font-size: 0.9rem; text-align: center; display: none; margin-bottom: 1rem;">Question not found!</div>

                <div id="editor-canvas" style="display: none;">
                    <div class="question-card" id="edit-q-card">
                        <!-- Populated dynamically via JS -->
                    </div>
                    
                    <div style="background: #eff6ff; padding: 1.5rem; border-radius: 12px; border: 1px solid #bfdbfe; margin-top: 1.5rem;">
                        <div class="input-group" style="margin-bottom: 0;">
                            <label>Change Correct Answer</label>
                            <div style="display: flex; gap: 10px;">
                                <select id="edit-answer-select" style="margin-bottom: 0;">
                                    <option value="A">Option A</option>
                                    <option value="B">Option B</option>
                                    <option value="C">Option C</option>
                                    <option value="D">Option D</option>
                                </select>
                                <button class="btn btn-green" style="width: auto; padding: 0 1.5rem;" onclick="updateAnswer()" id="update-btn">Save Update</button>
                            </div>
                        </div>
                    </div>

                    <div style="margin-top: 1.5rem; text-align: right;">
                        <button class="btn btn-red" style="width: auto; display: inline-flex;" onclick="deleteMainQuestion()" id="delete-main-btn">🗑️ Delete Question Forever</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- TAB 2: ALOC STAGING & PULL ENGINE          -->
        <!-- ========================================== -->
        <div id="tab-staging" class="tab-panel">
            <div class="staging-layout">
                
                <!-- LEFT PANEL: ALOC FETCH -->
                <div class="panel-card">
                    <h3 style="margin-top:0; color: #0f172a; font-size: 1.2rem;">Pull from ALOC</h3>
                    <p style="color: #64748b; font-size: 0.85rem; margin-bottom: 1.5rem;">Fetch unique questions into the dummy table.</p>
                    
                    <div class="input-group">
                        <label>ALOC API Key (Token)</label>
                        <input type="text" id="aloc-key" placeholder="Paste ALOC Key...">
                    </div>
                    
                    <div class="input-group">
                        <label>Subject</label>
                        <select id="aloc-subject">
                            <option value="english">English Language</option>
                            <option value="mathematics">Mathematics</option>
                            <option value="physics">Physics</option>
                            <option value="chemistry">Chemistry</option>
                            <option value="biology">Biology</option>
                            <option value="economics">Economics</option>
                            <option value="commerce">Commerce</option>
                            <option value="government">Government</option>
                            <option value="literature">Literature in English</option>
                        </select>
                    </div>
                    
                    <button class="btn btn-blue" id="fetch-btn" onclick="fetchFromALOC()">Pull Questions</button>
                    <div id="fetch-status" style="font-size: 0.85rem; text-align: center; font-weight: 700; margin-top: 10px;"></div>
                </div>

                <div class="panel-card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 10px;">
                        <h3 style="margin:0; color: #0f172a; font-size: 1.2rem;">Review & Approve</h3>
                        <div style="background: #eff6ff; color: #2563eb; padding: 4px 10px; border-radius: 8px; font-weight: 700; font-size: 0.85rem;">
                            <span id="staging-count">0</span> In Queue
                        </div>
                    </div>

                    <div id="empty-state" style="text-align: center; color: #94a3b8; padding: 2rem 0;">
                        <svg style="width: 40px; opacity: 0.5; margin-bottom: 10px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                        <p style="margin: 0; font-size: 0.9rem;">Dummy table is empty. Fetch questions.</p>
                    </div>

                    <div id="review-canvas">
                        <div class="question-card" id="q-card"></div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 1rem;">
                            <button class="btn btn-red" onclick="deleteStagingQuestion()" id="del-btn">🗑️ Trash</button>
                            <button class="btn btn-green" onclick="approveAndMove()" id="app-btn">✅ Approve</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../static/app.js"></script>

    <script>
        // ADMIN FAILSAFE
        if (typeof supabaseClient === 'undefined') {
            const supabaseUrl = 'PASTE_YOUR_SUPABASE_URL_HERE';
            const supabaseKey = 'PASTE_YOUR_SUPABASE_ANON_KEY_HERE';
            window.supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
        }

        const SUBJECTS_LIST = ['english', 'mathematics', 'physics', 'chemistry', 'biology', 'economics', 'commerce', 'government', 'literature'];
        let stagingQueue = [];
        let currentIndex = 0;
        let activeEditQuestionId = null;

        // 🚀 THE ULTIMATE UNIVERSAL MOJIBAKE DECODER
        const MOJIBAKE_MAP = {
            "a\u0161": "\\sqrt{", "â€²â€²": "-", "âr′": "-", "\\l_s": "\\theta", "\\l,": "\\theta", "i\\in": "\\pi", "Î\\_s": "\\theta",
            "kgmal": "kgm^{-3}", "Nma 2": "Nm^{-2}", "msâˆ’1": "ms^{-1}", "msâˆ’2": "ms^{-2}", "â€™": "'", "â€˜": "'", "â€œ": '"', "â€": '"', "â€": '"', 
            "â€š": "‚", "â€ž": "„", "â€“": "-", "â€”": "-", "â€¦": "...", "â€¢": "•", "â‚¬": "€", "Â£": "£", "â‚¦": "₦",
            "âˆ’": "−", "â‰¡": "≡", "â‰ˆ": "≈", "âˆ¼": "∼", "âˆ": "∝", "âˆ«": "∫", "âˆ‘": "∑", "âˆЏ": "∏", "âˆ†": "Δ", "âˆ‡": "∇",
            "âˆˆ": "∈", "âˆ‰": "∉", "âˆ©": "∩", "âˆª": "∪", "âˆ´": "∴", "âˆµ": "∵", "âˆ—": "∗", "âˆ˜": "∘", "âŠ‚": "⊂", "âŠƒ": "⊃", "âŠ†": "⊆", "âŠ‡": "⊇",
            "âŠ•": "⊕", "âŠ—": "⊗", "âŠ¥": "⊥", "â‹…": "⋅", "Ã—": "×", "Ã·": "÷", "Â°": "°", "Â±": "±", "â‰ ": "≠", "â‰¤": "≤", "â‰¥": "≥", "âˆž": "∞", "âˆš": "√",
            "Â²": "^2", "Â³": "^3", "Â¹": "^1", "Â¼": "¼", "Â½": "½", "Â¾": "¾", "â†’": "→", "â‡Œ": "⇌", "â†": "←", "â†‘": "↑", "â†“": "↓", "â†”": "↔",
            "â‡’": "⇒", "â‡": "⇐", "â‡‘": "⇑", "â‡“": "⇓", "â‡”": "⇔", "Î±": "α", "Î²": "β", "Î³": "γ", "Î´": "δ", "Îµ": "ε", "Î¶": "ζ", 
            "Î·": "η", "Î¸": "θ", "Î¹": "ι", "Îº": "κ", "Î»": "λ", "Î¼": "μ", "Âµ": "μ", "Î½": "ν", "Î¾": "ξ", "Î¿": "ο", "Ï€": "π", "Ï": "ρ", "Ï‚": "ς", 
            "Ïƒ": "σ", "Ï„": "τ", "Ï…": "υ", "Ï†": "φ", "Ï‡": "χ", "Ïˆ": "ψ", "Ï‰": "ω", "Â": " " 
        };
        const MOJIBAKE_KEYS = Object.keys(MOJIBAKE_MAP).sort((a, b) => b.length - a.length);

        function prepText(txt) {
            if (!txt) return "";
            let c = txt.toString();
            for (let i = 0; i < MOJIBAKE_KEYS.length; i++) {
                c = c.split(MOJIBAKE_KEYS[i]).join(MOJIBAKE_MAP[MOJIBAKE_KEYS[i]]);
            }
            const mathCommands = ['\\frac', '\\theta', '\\pi', '\\sqrt', '\\alpha', '\\beta', '\\int', '\\sum', '\\sin', '\\cos', '\\tan', '^'];
            const hasMath = mathCommands.some(cmd => c.includes(cmd));
            const hasDelimiters = c.includes('$') || c.includes('\\(') || c.includes('\\[');
            if (hasMath && !hasDelimiters) c = '\\( ' + c + ' \\)';
            return c;
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) return window.location.href = '../login/index.html?mode=admin';
            
            const { data: profile } = await supabaseClient.from('profiles').select('role').eq('id', session.user.id).single();
            if (!profile || profile.role !== 'admin') {
                alert("SECURITY LOCKOUT: Admin only.");
                window.location.href = '../dashboard/index.html';
                return;
            }

            if(localStorage.getItem('aloc_key')) document.getElementById('aloc-key').value = localStorage.getItem('aloc_key');

            loadStagingQueue();
            fetchDatabaseStats();
        });

        // 🚀 UI TAB SWITCHER
        function switchTab(tabId) {
            document.querySelectorAll('.tab-panel').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        // 🚀 FEATURE 1: FETCH GLOBAL DATABASE STATS
        async function fetchDatabaseStats() {
            const container = document.getElementById('stats-container');
            container.innerHTML = '';

            for (const subject of SUBJECTS_LIST) {
                // Using head: true & count: exact makes this very fast
                const { count, error } = await supabaseClient
                    .from('questions')
                    .select('*', { count: 'exact', head: true })
                    .eq('subject', subject);
                
                if(!error) {
                    const shortName = subject === 'mathematics' ? 'MATH' : subject.substring(0, 4);
                    container.innerHTML += `
                        <div class="stat-pill">
                            <span>${shortName}</span>
                            <strong>${count}</strong>
                        </div>
                    `;
                }
            }
        }

        // ==============================================================
        // 🚀 FEATURE 2: QUESTION EDITOR ENGINE (SEARCH, UPDATE, DELETE)
        // ==============================================================
        async function searchQuestion() {
            const searchId = document.getElementById('search-id-input').value.trim().toUpperCase();
            const btn = document.getElementById('search-btn');
            const errorDiv = document.getElementById('search-error');
            const canvas = document.getElementById('editor-canvas');

            if (!searchId || searchId.length < 4) return;

            btn.innerText = "🔍"; btn.disabled = true;
            errorDiv.style.display = 'none';
            canvas.style.display = 'none';

            try {
                // Search Main Table
                const { data, error } = await supabaseClient
                    .from('questions')
                    .select('*')
                    .eq('short_id', searchId)
                    .limit(1)
                    .maybeSingle();

                if (error) throw error;

                if (!data) {
                    errorDiv.style.display = 'block';
                    return;
                }

                // Question found! Render it in editor
                activeEditQuestionId = data.id; // Save DB UUID for updating/deleting

                const isCorrect = (opt) => data.correct_answer === opt ? 'correct-ans' : '';
                
                const cardHtml = `
                    <div class="q-meta">
                        <span style="color: #2563eb;">${(data.subject || "Subject").toUpperCase()} • Year: ${data.year || 'N/A'}</span>
                        <span style="background:#e2e8f0; padding:3px 10px; border-radius:6px; font-size:0.8rem;">Ref: ${data.short_id}</span>
                    </div>
                    <div class="q-text">${prepText(data.question_text)}</div>
                    
                    <div class="option-box ${isCorrect('A')}">
                        <div class="opt-letter">A</div> <span class="opt-text">${prepText(data.option_a)}</span>
                    </div>
                    <div class="option-box ${isCorrect('B')}">
                        <div class="opt-letter">B</div> <span class="opt-text">${prepText(data.option_b)}</span>
                    </div>
                    <div class="option-box ${isCorrect('C')}">
                        <div class="opt-letter">C</div> <span class="opt-text">${prepText(data.option_c)}</span>
                    </div>
                    <div class="option-box ${isCorrect('D')}">
                        <div class="opt-letter">D</div> <span class="opt-text">${prepText(data.option_d)}</span>
                    </div>
                `;

                document.getElementById('edit-q-card').innerHTML = cardHtml;
                document.getElementById('edit-answer-select').value = data.correct_answer || 'A';
                
                canvas.style.display = 'block';
                if (window.MathJax) MathJax.typesetPromise();

            } catch (err) {
                console.error("Search Error:", err);
                alert("Search failed: " + err.message);
            } finally {
                btn.innerText = "Search"; btn.disabled = false;
            }
        }

        async function updateAnswer() {
            if(!activeEditQuestionId) return;
            const newAns = document.getElementById('edit-answer-select').value;
            const btn = document.getElementById('update-btn');
            
            btn.innerText = "Saving..."; btn.disabled = true;

            try {
                const { error } = await supabaseClient
                    .from('questions')
                    .update({ correct_answer: newAns })
                    .eq('id', activeEditQuestionId);
                
                if (error) throw error;
                
                alert("✅ Answer updated successfully!");
                searchQuestion(); // Re-trigger search to refresh UI

            } catch(err) {
                alert("Update failed: " + err.message);
            } finally {
                btn.innerText = "Save Update"; btn.disabled = false;
            }
        }

        async function deleteMainQuestion() {
            if(!activeEditQuestionId) return;
            if(!confirm("⚠️ Are you sure you want to permanently delete this question from the main database?")) return;

            const btn = document.getElementById('delete-main-btn');
            btn.innerText = "Deleting..."; btn.disabled = true;

            try {
                const { error } = await supabaseClient
                    .from('questions')
                    .delete()
                    .eq('id', activeEditQuestionId);
                
                if (error) throw error;
                
                alert("🗑️ Question deleted permanently.");
                document.getElementById('editor-canvas').style.display = 'none';
                document.getElementById('search-id-input').value = '';
                
                fetchDatabaseStats(); // Update header stats

            } catch(err) {
                alert("Delete failed: " + err.message);
            } finally {
                btn.innerText = "🗑️ Delete Question Forever"; btn.disabled = false;
            }
        }


        // ==============================================================
        // 🚀 FEATURE 3: ALOC STAGING ENGINE (EXISTING CODE PRESERVED)
        // ==============================================================
        async function fetchFromALOC() {
            const apiKey = document.getElementById('aloc-key').value.trim();
            const subject = document.getElementById('aloc-subject').value;
            const btn = document.getElementById('fetch-btn');
            const status = document.getElementById('fetch-status');
            
            if (!apiKey) { alert("Please enter your ALOC Access Token."); return; }
            localStorage.setItem('aloc_key', apiKey); 

            btn.innerText = "Connecting to ALOC...";
            btn.disabled = true;
            status.style.color = "#2563eb";
            status.innerText = "Scanning database for existing questions...";

            try {
                const dbSubject = (subject === 'mathematic' || subject === 'mathematics') ? 'mathematics' : subject;

                const [{data: mainQs}, {data: stageQs}] = await Promise.all([
                    supabaseClient.from('questions').select('question_text').eq('subject', dbSubject),
                    supabaseClient.from('staging_questions').select('question_text').eq('subject', dbSubject)
                ]);

                const allExisting = new Set([
                    ...(mainQs || []).map(q => q.question_text.trim().toLowerCase()),
                    ...(stageQs || []).map(q => q.question_text.trim().toLowerCase())
                ]);

                status.innerText = "Pulling from ALOC API...";

                let json = null;
                let fetchSuccess = false;
                
                for(let attempt = 1; attempt <= 3; attempt++) {
                    try {
                        const response = await fetch(`https://questions.aloc.com.ng/api/v2/q/40?subject=${subject}`, {
                            method: 'GET',
                            headers: { 'Accept': 'application/json', 'AccessToken': apiKey }
                        });
                        json = await response.json();
                        if (json && json.status === 200 && json.data) {
                            fetchSuccess = true;
                            break; 
                        }
                    } catch(e) {
                        console.warn(`ALOC Fetch attempt ${attempt} failed. Retrying...`);
                    }
                }

                if (!fetchSuccess) throw new Error("ALOC API failed to respond. Please try again.");

                status.innerText = "Filtering out duplicates & building instructions...";

                const newQuestions = [];
                json.data.forEach(q => {
                    let finalQuestionText = q.question;
                    if (dbSubject === 'english' && q.section) {
                        finalQuestionText = `<strong>Instruction:</strong> <em>${q.section}</em><br><br>${q.question}`;
                    }

                    const qTextLower = finalQuestionText.trim().toLowerCase();
                    
                    if (!allExisting.has(qTextLower)) {
                        newQuestions.push({
                            subject: dbSubject, 
                            question_text: finalQuestionText,
                            option_a: q.option.a || "N/A",
                            option_b: q.option.b || "N/A",
                            option_c: q.option.c || "N/A",
                            option_d: q.option.d || "N/A",
                            correct_answer: (q.answer || "").toUpperCase(),
                            short_id: Math.random().toString(36).substr(2, 4).toUpperCase(), 
                            year: q.examyear || "2026"
                        });
                        allExisting.add(qTextLower);
                    }
                });

                if (newQuestions.length === 0) throw new Error(`ALOC returned questions that are all DUPLICATES. Try pulling again.`);

                status.innerText = `Saving ${newQuestions.length} unique questions...`;
                const { error } = await supabaseClient.from('staging_questions').insert(newQuestions);
                if (error) throw error;

                status.style.color = "#16a34a";
                status.innerText = `Success! Added ${newQuestions.length} new questions. (${json.data.length - newQuestions.length} duplicates skipped).`;
                
                setTimeout(() => loadStagingQueue(), 500);

            } catch (err) {
                status.style.color = "#dc2626";
                status.innerText = "Error: " + err.message;
            } finally {
                btn.innerText = "Pull Questions";
                btn.disabled = false;
            }
        }

        async function loadStagingQueue() {
            const { data, error } = await supabaseClient.from('staging_questions').select('*');
            if (error) return;

            stagingQueue = data || [];
            document.getElementById('staging-count').innerText = stagingQueue.length;

            if (stagingQueue.length === 0) {
                document.getElementById('empty-state').style.display = 'block';
                document.getElementById('review-canvas').style.display = 'none';
            } else {
                document.getElementById('empty-state').style.display = 'none';
                document.getElementById('review-canvas').style.display = 'block';
                currentIndex = 0;
                renderQuestion();
            }
        }

        function renderQuestion() {
            const q = stagingQueue[currentIndex];
            if (!q) return loadStagingQueue();

            const isCorrect = (opt) => q.correct_answer === opt ? 'correct-ans' : '';

            const html = `
                <div class="q-meta">
                    <span>${q.subject.toUpperCase()} • Year: ${q.year}</span>
                    <span style="background:#e2e8f0; padding:3px 10px; border-radius:6px;">Ref: ${q.short_id}</span>
                </div>
                <div class="q-text">${prepText(q.question_text)}</div>
                
                <div class="option-box ${isCorrect('A')}"><div class="opt-letter">A</div><span class="opt-text">${prepText(q.option_a)}</span></div>
                <div class="option-box ${isCorrect('B')}"><div class="opt-letter">B</div><span class="opt-text">${prepText(q.option_b)}</span></div>
                <div class="option-box ${isCorrect('C')}"><div class="opt-letter">C</div><span class="opt-text">${prepText(q.option_c)}</span></div>
                <div class="option-box ${isCorrect('D')}"><div class="opt-letter">D</div><span class="opt-text">${prepText(q.option_d)}</span></div>
            `;
            
            document.getElementById('q-card').innerHTML = html;
            if (window.MathJax) MathJax.typesetPromise();
        }

        async function approveAndMove() {
            const q = stagingQueue[currentIndex];
            const btn = document.getElementById('app-btn');
            btn.innerText = "Checking..."; btn.disabled = true;

            try {
                const { data: duplicateCheck } = await supabaseClient.from('questions').select('id').eq('question_text', q.question_text).maybeSingle();

                if (duplicateCheck) {
                    alert("⚠️ Duplicate Prevented! Deleting from staging...");
                    await supabaseClient.from('staging_questions').delete().eq('id', q.id);
                    stagingQueue.splice(currentIndex, 1);
                    updateUIAfterAction();
                    return; 
                }

                btn.innerText = "Moving...";
                const { error: insErr } = await supabaseClient.from('questions').insert([{
                    subject: q.subject, question_text: q.question_text,
                    option_a: q.option_a, option_b: q.option_b, option_c: q.option_c, option_d: q.option_d,
                    correct_answer: q.correct_answer, short_id: q.short_id, year: q.year
                }]);
                
                if (insErr) throw insErr;

                await supabaseClient.from('staging_questions').delete().eq('id', q.id);
                
                stagingQueue.splice(currentIndex, 1);
                updateUIAfterAction();
                fetchDatabaseStats(); // Update header stats

            } catch (err) {
                alert("Move Error: " + err.message);
            } finally {
                btn.innerHTML = "✅ Approve"; btn.disabled = false;
            }
        }

        async function deleteStagingQuestion() {
            const q = stagingQueue[currentIndex];
            const btn = document.getElementById('del-btn');
            btn.innerText = "Deleting..."; btn.disabled = true;

            try {
                await supabaseClient.from('staging_questions').delete().eq('id', q.id);
                stagingQueue.splice(currentIndex, 1);
                updateUIAfterAction();
            } catch (err) {
                alert("Delete Error: " + err.message);
            } finally {
                btn.innerHTML = "🗑️ Trash"; btn.disabled = false;
            }
        }

        function updateUIAfterAction() {
            document.getElementById('staging-count').innerText = stagingQueue.length;
            if (stagingQueue.length === 0) {
                document.getElementById('empty-state').style.display = 'block';
                document.getElementById('review-canvas').style.display = 'none';
            } else {
                if (currentIndex >= stagingQueue.length) currentIndex = 0; 
                renderQuestion();
            }
        }
    </script>
</body>
</html>
