<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Enterprise Bank Manager - AFIT CBT</title>
    
    <link rel="icon" type="image/svg+xml" href="../static/img/afitcbtsim-logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">
    
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true },
            options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre'] }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        /* 🚀 HIGH-END ENTERPRISE DARK THEME */
        :root {
            --bg-base: #020617; /* Slate 950 */
            --bg-panel: rgba(15, 23, 42, 0.6); /* Slate 900 translucent */
            --bg-card: rgba(30, 41, 59, 0.4); /* Slate 800 translucent */
            --border-glow: rgba(56, 189, 248, 0.15);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --glass-blur: blur(16px);
        }

        *, *::before, *::after { box-sizing: border-box; }
        
        body { 
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            margin: 0; padding: 0; 
            overflow-x: hidden; width: 100%;
            min-height: 100vh;
        }

        /* TYPOGRAPHY */
        h1, h2, h3, h4 { font-family: 'Poppins', sans-serif; letter-spacing: -0.5px; margin: 0; }
        
        /* NAVBAR */
        .admin-nav {
            height: 70px; background: rgba(2, 6, 23, 0.8); backdrop-filter: var(--glass-blur);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 5%; position: sticky; top: 0; z-index: 100; 
            border-bottom: 1px solid var(--border-subtle);
        }
        
        /* GLOBAL STATS BAR */
        .global-stats-bar {
            display: flex; gap: 15px; overflow-x: auto; padding: 1.5rem 5%; 
            background: rgba(15, 23, 42, 0.3); border-bottom: 1px solid var(--border-subtle); width: 100%;
            -ms-overflow-style: none; scrollbar-width: none;
        }
        .global-stats-bar::-webkit-scrollbar { display: none; }
        
        .stat-box {
            background: var(--bg-card); backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-glow); border-radius: 12px; padding: 12px 24px; 
            text-align: center; min-width: 120px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); flex-shrink: 0;
            transition: transform 0.2s;
        }
        .stat-box:hover { transform: translateY(-2px); border-color: rgba(56, 189, 248, 0.4); }
        .stat-box span { display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .stat-box strong { font-size: 1.6rem; color: #fff; font-family: 'Poppins', sans-serif; }

        /* TABS */
        .tab-wrapper { padding: 2rem 5% 0 5%; display: flex; gap: 12px; flex-wrap: wrap; width: 100%; }
        .tab-btn {
            padding: 1rem 2rem; border-radius: 12px; font-weight: 600; border: 1px solid transparent; cursor: pointer; 
            background: rgba(30, 41, 59, 0.6); color: var(--text-muted); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            flex-grow: 1; text-align: center; font-size: 1rem; backdrop-filter: var(--glass-blur);
        }
        .tab-btn:hover { background: rgba(51, 65, 85, 0.8); color: white; }
        .tab-btn.active { 
            background: rgba(59, 130, 246, 0.15); color: #60a5fa; 
            border: 1px solid rgba(59, 130, 246, 0.3); box-shadow: 0 0 20px rgba(59, 130, 246, 0.1); 
        }

        /* LAYOUT CONTAINERS */
        .staging-layout { display: grid; grid-template-columns: 380px 1fr; max-width: 1500px; margin: 2rem auto; gap: 2rem; padding: 0 5%; width: 100%; align-items: start; }
        .editor-layout { max-width: 1000px; margin: 2rem auto; padding: 0 5%; width: 100%; display: none; }
        
        .panel-card { 
            background: var(--bg-panel); backdrop-filter: var(--glass-blur); padding: 2.5rem; 
            border-radius: 24px; border: 1px solid var(--border-subtle); 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); width: 100%; 
        }
        
        /* INPUTS & FORMS */
        .input-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;}
        .input-group select, .input-group input { 
            width: 100%; padding: 1rem 1.2rem; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); 
            background: rgba(0,0,0,0.2); color: white; font-family: 'Inter', sans-serif; 
            margin-bottom: 1.5rem; font-size: 1rem; transition: all 0.2s; outline: none;
        }
        .input-group select:focus, .input-group input:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(59,130,246,0.2); }
        .input-group select option { background: #0f172a; color: white; }
        
        .search-flex { display: flex; gap: 12px; width: 100%; align-items: stretch; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .search-flex input { margin-bottom: 0; flex-grow: 1; min-width: 0; }
        .search-flex button { flex-shrink: 0; margin-bottom: 0; }

        /* HIGH-END BUTTONS */
        .btn { 
            width: 100%; padding: 1rem; border-radius: 12px; font-weight: 600; border: none; cursor: pointer; 
            font-size: 1rem; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; justify-content: center; align-items: center; gap: 8px; 
            font-family: 'Inter', sans-serif;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn:active { transform: translateY(0); }
        
        .btn-blue { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; box-shadow: 0 10px 20px -10px rgba(37,99,235,0.5); }
        .btn-blue:hover { box-shadow: 0 15px 25px -10px rgba(37,99,235,0.7); }
        
        .btn-green { background: linear-gradient(135deg, #059669, #047857); color: white; box-shadow: 0 10px 20px -10px rgba(16,185,129,0.5); }
        .btn-green:hover { box-shadow: 0 15px 25px -10px rgba(16,185,129,0.7); }
        
        .btn-red { background: rgba(239, 68, 68, 0.1); color: #fca5a5; border: 1px solid rgba(239,68,68,0.2); }
        .btn-red:hover { background: rgba(239, 68, 68, 0.2); border-color: rgba(239,68,68,0.4); color: white;}
        
        .btn-orange { background: linear-gradient(135deg, #ea580c, #c2410c); color: white; box-shadow: 0 10px 20px -10px rgba(234,88,12,0.5); }

        /* 🚀 QUESTION PREVIEW (GLASS STYLE) */
        .question-card { 
            border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; padding: 2rem; 
            background: rgba(0,0,0,0.2); width: 100%; overflow-x: auto; 
        }
        .q-meta { display: flex; justify-content: space-between; font-weight: 600; color: var(--text-muted); border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 1.2rem; margin-bottom: 1.5rem; text-transform: uppercase; flex-wrap: wrap; gap: 10px; font-size: 0.85rem;}
        .q-text { font-size: 1.15rem; font-weight: 400; margin-bottom: 2.5rem; line-height: 1.7; word-wrap: break-word; overflow-wrap: break-word; color: #f8fafc;}
        
        .option-box { 
            display: flex; align-items: center; padding: 1rem 1.2rem; background: rgba(255,255,255,0.03); 
            border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; margin-bottom: 1rem; word-wrap: break-word; transition: all 0.2s;
        }
        .option-box.correct-ans { background: rgba(16, 185, 129, 0.1); border-color: rgba(16,185,129,0.4); box-shadow: 0 0 20px rgba(16,185,129,0.05); }
        .opt-letter { 
            width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,0.1); display: flex; 
            justify-content: center; align-items: center; font-weight: 700; margin-right: 15px; color: #cbd5e1; flex-shrink: 0;
        }
        .option-box.correct-ans .opt-letter { background: var(--accent-green); color: white; }

        /* INSTRUCTION HIGHLIGHT BOX */
        .instruction-box {
            background: rgba(59, 130, 246, 0.1); padding: 1rem 1.5rem; border-radius: 12px; 
            border-left: 4px solid var(--accent-blue); margin-bottom: 1.5rem; color: #e2e8f0;
        }

        /* MOBILE OVERRIDES */
        @media (max-width: 900px) {
            .admin-nav { flex-direction: column; height: auto; padding: 1rem; gap: 15px; text-align: center; }
            .staging-layout { grid-template-columns: 1fr; padding: 0 1rem; gap: 1.5rem; margin: 1.5rem auto;}
            .editor-layout { padding: 0 1rem; }
            .panel-card { padding: 1.5rem; }
            .tab-wrapper { padding: 1.5rem 1rem 0 1rem; }
            .search-flex { flex-direction: column; }
            .search-flex button { width: 100%; }
            #edit-actions, #staging-actions { display: flex; flex-direction: column; gap: 12px; margin-top: 2rem; }
            #edit-actions button, #staging-actions button { width: 100%; }
        }
    </style>
</head>
<body>

    <nav class="admin-nav">
        <div style="font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 1.2rem; display: flex; align-items: center; gap: 10px;">
            <div style="width: 10px; height: 10px; background: #38bdf8; border-radius: 50%; box-shadow: 0 0 10px #38bdf8;"></div>
            Enterprise Bank Manager
        </div>
        <button onclick="window.location.href='../profile/index.html'" style="background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s;">Exit Terminal</button>
    </nav>

    <!-- GLOBAL STATS BAR -->
    <div class="global-stats-bar" id="stats-bar">
        <div class="stat-box"><span>Telemetry</span><strong>Syncing...</strong></div>
    </div>

    <!-- TABS -->
    <div class="tab-wrapper">
        <button class="tab-btn active" id="tab-btn-staging" onclick="switchTab('staging')">
            <svg style="width:18px; vertical-align:middle; margin-right:5px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
            ALOC Staging API
        </button>
        <button class="tab-btn" id="tab-btn-editor" onclick="switchTab('editor')">
            <svg style="width:18px; vertical-align:middle; margin-right:5px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
            Live Database Editor
        </button>
    </div>

    <!-- ========================================== -->
    <!-- TAB 1: ALOC STAGING AREA                   -->
    <!-- ========================================== -->
    <div class="staging-layout" id="section-staging">
        
        <!-- LEFT PANEL: FETCH ENGINE -->
        <div class="panel-card">
            <h3 style="color: #fff; font-size: 1.4rem; margin-bottom: 5px;">Data Ingestion</h3>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem;">Query the ALOC endpoints for fresh batch data.</p>
            
            <div class="input-group">
                <label>Auth Token (API Key)</label>
                <input type="text" id="aloc-key" placeholder="Paste ALOC Token...">
            </div>
            
            <div class="input-group">
                <label>Target Subject</label>
                <select id="aloc-subject">
                    <option value="english">English Language</option>
                    <option value="mathematics">Mathematics</option>
                    <option value="physics">Physics</option>
                    <option value="chemistry">Chemistry</option>
                    <option value="biology">Biology</option>
                    <option value="economics">Economics</option>
                    <option value="commerce">Commerce</option>
                    <option value="government">Government</option>
                    <option value="literature">Literature in English</option>
                </select>
            </div>
            
            <button class="btn btn-blue" id="fetch-btn" onclick="fetchFromALOC()">Execute Query</button>
            <div id="fetch-status" style="font-size: 0.85rem; text-align: center; font-weight: 600; margin-top: 15px;"></div>
        </div>

        <!-- RIGHT PANEL: REVIEW QUEUE -->
        <div class="panel-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 10px;">
                <h3 style="color: #fff; font-size: 1.4rem;">Quality Control Queue</h3>
                <div style="background: rgba(59, 130, 246, 0.15); color: #60a5fa; padding: 6px 14px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; border: 1px solid rgba(59,130,246,0.3);">
                    <span id="staging-count">0</span> Pending
                </div>
            </div>

            <div id="empty-state" style="text-align: center; color: var(--text-muted); padding: 4rem 0;">
                <svg style="width: 60px; opacity: 0.3; margin-bottom: 15px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                <p style="font-size: 1.1rem;">Buffer is empty. Awaiting ingestion.</p>
            </div>

            <div id="review-canvas" style="display: none;">
                <div class="question-card" id="q-card"></div>
                <div id="staging-actions" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 2rem;">
                    <button class="btn btn-red" onclick="deleteStagingQuestion()" id="del-btn">Discard Data</button>
                    <button class="btn btn-green" onclick="approveAndMove()" id="app-btn">Commit to Database</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- TAB 2: QUESTION EDITOR (MAIN DB)           -->
    <!-- ========================================== -->
    <div class="editor-layout" id="section-editor">
        <div class="panel-card">
            <h3 style="color: #fff; font-size: 1.4rem; margin-bottom: 5px;">Live Production Editor</h3>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem;">Mutate or obliterate active records using their 4-character short hash.</p>
            
            <div class="search-flex">
                <input type="text" id="search-id" placeholder="Enter Hash (e.g. X8B2)" maxlength="5" style="text-transform: uppercase;">
                <button class="btn btn-blue" onclick="searchMainDatabase()" id="search-btn" style="width: auto;">Query Database</button>
            </div>
            
            <div id="search-status" style="font-size: 0.95rem; font-weight: 600; margin-bottom: 1.5rem; text-align: center;"></div>

            <div id="editor-canvas" style="display: none; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 2rem;">
                <div class="question-card" id="editor-q-card" style="margin-bottom: 2rem;"></div>
                
                <div class="input-group">
                    <label>Modify Correct Pointer</label>
                    <select id="edit-correct-option">
                        <option value="A">Pointer A</option>
                        <option value="B">Pointer B</option>
                        <option value="C">Pointer C</option>
                        <option value="D">Pointer D</option>
                    </select>
                </div>

                <div id="edit-actions" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <button class="btn btn-red" onclick="deleteMainQuestion()" id="edit-del-btn">Obliterate Record</button>
                    <button class="btn btn-orange" onclick="updateMainAnswer()" id="edit-update-btn">Save Mutation</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../static/app.js"></script>

    <script>
        if (typeof supabaseClient === 'undefined') {
            const supabaseUrl = 'PASTE_YOUR_SUPABASE_URL_HERE';
            const supabaseKey = 'PASTE_YOUR_SUPABASE_ANON_KEY_HERE';
            window.supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
        }

        let stagingQueue = [];
        let currentIndex = 0;
        let activeEditorQuestion = null;

        const MOJIBAKE_MAP = {
            "a\u0161": "\\sqrt{", "â€²â€²": "-", "âr′": "-", "\\l_s": "\\theta", "\\l,": "\\theta", "i\\in": "\\pi", "Î\\_s": "\\theta",
            "kgmal": "kgm^{-3}", "Nma 2": "Nm^{-2}", "msâˆ’1": "ms^{-1}", "msâˆ’2": "ms^{-2}", "â€™": "'", "â€˜": "'", "â€œ": '"', "â€": '"', "â€": '"', 
            "â€š": "‚", "â€ž": "„", "â€“": "-", "â€”": "-", "â€¦": "...", "â€¢": "•", "â‚¬": "€", "Â£": "£", "â‚¦": "₦",
            "âˆ’": "−", "â‰¡": "≡", "â‰ˆ": "≈", "âˆ¼": "∼", "âˆ": "∝", "âˆ«": "∫", "âˆ‘": "∑", "âˆЏ": "∏", "âˆ†": "Δ", "âˆ‡": "∇",
            "âˆˆ": "∈", "âˆ‰": "∉", "âˆ©": "∩", "âˆª": "∪", "âˆ´": "∴", "âˆµ": "∵", "âˆ—": "∗", "âˆ˜": "∘", "âŠ‚": "⊂", "âŠƒ": "⊃", "âŠ†": "⊆", "âŠ‡": "⊇",
            "âŠ•": "⊕", "âŠ—": "⊗", "âŠ¥": "⊥", "â‹…": "⋅", "Ã—": "×", "Ã·": "÷", "Â°": "°", "Â±": "±", "â‰ ": "≠", "â‰¤": "≤", "â‰¥": "≥", "âˆž": "∞", "âˆš": "√",
            "Â²": "^2", "Â³": "^3", "Â¹": "^1", "Â¼": "¼", "Â½": "½", "Â¾": "¾", "â†’": "→", "â‡Œ": "⇌", "â†": "←", "â†‘": "↑", "â†“": "↓", "â†”": "↔",
            "â‡’": "⇒", "â‡": "⇐", "â‡‘": "⇑", "â‡“": "⇓", "â‡”": "⇔", "Î±": "α", "Î²": "β", "Î³": "γ", "Î´": "δ", "Îµ": "ε", "Î¶": "ζ", 
            "Î·": "η", "Î¸": "θ", "Î¹": "ι", "Îº": "κ", "Î»": "λ", "Î¼": "μ", "Âµ": "μ", "Î½": "ν", "Î¾": "ξ", "Î¿": "ο", "Ï€": "π", "Ï": "ρ", "Ï‚": "ς", 
            "Ïƒ": "σ", "Ï„": "τ", "Ï…": "υ", "Ï†": "φ", "Ï‡": "χ", "Ïˆ": "ψ", "Ï‰": "ω", "Â": " " 
        };
        const MOJIBAKE_KEYS = Object.keys(MOJIBAKE_MAP).sort((a, b) => b.length - a.length);

        function prepText(txt) {
            if (!txt) return "";
            let c = txt.toString();
            for (let i = 0; i < MOJIBAKE_KEYS.length; i++) {
                c = c.split(MOJIBAKE_KEYS[i]).join(MOJIBAKE_MAP[MOJIBAKE_KEYS[i]]);
            }
            const mathCommands = ['\\frac', '\\theta', '\\pi', '\\sqrt', '\\alpha', '\\beta', '\\int', '\\sum', '\\sin', '\\cos', '\\tan', '^'];
            const hasMath = mathCommands.some(cmd => c.includes(cmd));
            const hasDelimiters = c.includes('$') || c.includes('\\(') || c.includes('\\[');
            if (hasMath && !hasDelimiters) c = '\\( ' + c + ' \\)';
            return c;
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) return window.location.href = '../login/index.html?mode=admin';
            
            const { data: profile } = await supabaseClient.from('profiles').select('role').eq('id', session.user.id).single();
            if (!profile || (profile.role !== 'admin' && profile.role !== 'jnr-admin')) {
                alert("SECURITY LOCKOUT: Unauthorized Clearance.");
                window.location.href = '../dashboard/index.html';
                return;
            }

            if(localStorage.getItem('aloc_key')) document.getElementById('aloc-key').value = localStorage.getItem('aloc_key');

            loadGlobalStats();
            loadStagingQueue();
        });

        function switchTab(tab) {
            document.getElementById('tab-btn-staging').classList.remove('active');
            document.getElementById('tab-btn-editor').classList.remove('active');
            document.getElementById('section-staging').style.display = 'none';
            document.getElementById('section-editor').style.display = 'none';

            document.getElementById(`tab-btn-${tab}`).classList.add('active');
            document.getElementById(`section-${tab}`).style.display = tab === 'staging' ? 'grid' : 'block';
            
            if(window.innerWidth <= 900 && tab === 'staging') {
                document.getElementById('section-staging').style.display = 'block';
            }
        }

        async function loadGlobalStats() {
            const subjectsToCount = ['english', 'mathematics', 'physics', 'chemistry', 'biology', 'economics', 'commerce', 'government', 'literature', 'gns'];
            try {
                const countPromises = subjectsToCount.map(async (subj) => {
                    const { count, error } = await supabaseClient.from('questions').select('*', { count: 'exact', head: true }).eq('subject', subj);
                    return { subject: subj, count: error ? 0 : (count || 0) };
                });

                const results = await Promise.all(countPromises);
                let html = '';
                results.forEach(res => {
                    if (res.count > 0) html += `<div class="stat-box"><span>${res.subject.toUpperCase()}</span><strong>${res.count}</strong></div>`;
                });

                document.getElementById('stats-bar').innerHTML = html || '<div class="stat-box"><span>Bank Empty</span><strong>0</strong></div>';
            } catch (err) {
                document.getElementById('stats-bar').innerHTML = '<div class="stat-box"><span>Error</span><strong>!</strong></div>';
            }
        }

        async function fetchFromALOC() {
            const apiKey = document.getElementById('aloc-key').value.trim();
            const subject = document.getElementById('aloc-subject').value;
            const btn = document.getElementById('fetch-btn');
            const status = document.getElementById('fetch-status');
            
            if (!apiKey) { alert("Please enter API Key."); return; }
            localStorage.setItem('aloc_key', apiKey); 

            btn.innerText = "Processing..."; btn.disabled = true;
            status.style.color = "#60a5fa"; status.innerText = "Syncing with live database...";

            try {
                const dbSubject = (subject === 'mathematic' || subject === 'mathematics') ? 'mathematics' : subject;
                let alocSlug = subject;
                if (subject === 'literature') alocSlug = 'englishlit';

                const [{data: mainQs}, {data: stageQs}] = await Promise.all([
                    supabaseClient.from('questions').select('question_text').eq('subject', dbSubject),
                    supabaseClient.from('staging_questions').select('question_text').eq('subject', dbSubject)
                ]);

                const allExisting = new Set([
                    ...(mainQs || []).map(q => q.question_text.trim().toLowerCase()),
                    ...(stageQs || []).map(q => q.question_text.trim().toLowerCase())
                ]);

                status.innerText = "Querying ALOC payload...";

                let json = null, fetchSuccess = false;
                for(let attempt = 1; attempt <= 3; attempt++) {
                    try {
                        const response = await fetch(`https://questions.aloc.com.ng/api/v2/q/40?subject=${alocSlug}`, {
                            method: 'GET', headers: { 'Accept': 'application/json', 'AccessToken': apiKey }
                        });
                        json = await response.json();
                        if (json && json.status === 200 && json.data) { fetchSuccess = true; break; }
                    } catch(e) { console.warn(`Attempt ${attempt} failed.`); }
                }

                if (!fetchSuccess) throw new Error("Endpoint uncommunicative. Aborting.");

                status.innerText = "Sanitizing and decoding data...";

                const newQuestions = [];
                json.data.forEach(q => {
                    let finalQuestionText = q.question || "";
                    
                    // 🚀 FIXED: Inject Passage/Instruction for BOTH English and Literature
                    if ((dbSubject === 'english' || dbSubject === 'literature') && q.section) {
                        finalQuestionText = `
                            <div class="instruction-box">
                                <strong style="color: #93c5fd; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px;">Instruction / Passage</strong><br>
                                <em style="font-size: 1.05rem;">${q.section}</em>
                            </div>
                            ${finalQuestionText}
                        `;
                    }

                    // 🚀 Failsafe for literal empty questions
                    if (!finalQuestionText.trim()) {
                         finalQuestionText = `<em style="color: #fca5a5;">[Data Corruption: Endpoint provided no text body for this block. Recommend discard.]</em>`;
                    }

                    const qTextLower = finalQuestionText.trim().toLowerCase();
                    
                    if (!allExisting.has(qTextLower)) {
                        newQuestions.push({
                            subject: dbSubject, 
                            question_text: finalQuestionText,
                            option_a: q.option.a || "N/A",
                            option_b: q.option.b || "N/A",
                            option_c: q.option.c || "N/A",
                            option_d: q.option.d || "N/A",
                            correct_answer: (q.answer || "").toUpperCase(),
                            short_id: Math.random().toString(36).substr(2, 4).toUpperCase(),
                            year: q.examyear || "2026"
                        });
                        allExisting.add(qTextLower);
                    }
                });

                if (newQuestions.length === 0) throw new Error("Batch contained 100% duplicate signatures. Discarded.");

                status.innerText = `Committing ${newQuestions.length} valid blocks...`;
                const { error } = await supabaseClient.from('staging_questions').insert(newQuestions);
                if (error) throw error;

                status.style.color = "#10b981";
                status.innerText = `Ingestion successful. ${newQuestions.length} added (${json.data.length - newQuestions.length} duplicates rejected).`;
                setTimeout(() => loadStagingQueue(), 500);

            } catch (err) {
                console.error(err);
                status.style.color = "#fca5a5"; status.innerText = "Error: " + err.message;
            } finally {
                btn.innerText = "Execute Query"; btn.disabled = false;
            }
        }

        async function loadStagingQueue() {
            const { data, error } = await supabaseClient.from('staging_questions').select('*');
            if (error) return;
            stagingQueue = data || [];
            document.getElementById('staging-count').innerText = stagingQueue.length;

            if (stagingQueue.length === 0) {
                document.getElementById('empty-state').style.display = 'block';
                document.getElementById('review-canvas').style.display = 'none';
            } else {
                document.getElementById('empty-state').style.display = 'none';
                document.getElementById('review-canvas').style.display = 'block';
                currentIndex = 0;
                renderStagingCard();
            }
        }

        function renderStagingCard() {
            const q = stagingQueue[currentIndex];
            if (!q) return loadStagingQueue();
            const isCorrect = (opt) => q.correct_answer === opt ? 'correct-ans' : '';
            const html = `
                <div class="q-meta">
                    <span>${q.subject} // YR: ${q.year}</span>
                    <span style="background: rgba(255,255,255,0.1); padding: 4px 12px; border-radius: 6px; font-family: monospace;">HASH: ${q.short_id}</span>
                </div>
                <div class="q-text">${prepText(q.question_text)}</div>
                <div class="option-box ${isCorrect('A')}"><div class="opt-letter">A</div> <span class="opt-text">${prepText(q.option_a)}</span></div>
                <div class="option-box ${isCorrect('B')}"><div class="opt-letter">B</div> <span class="opt-text">${prepText(q.option_b)}</span></div>
                <div class="option-box ${isCorrect('C')}"><div class="opt-letter">C</div> <span class="opt-text">${prepText(q.option_c)}</span></div>
                <div class="option-box ${isCorrect('D')}"><div class="opt-letter">D</div> <span class="opt-text">${prepText(q.option_d)}</span></div>
            `;
            document.getElementById('q-card').innerHTML = html;
            if (window.MathJax) MathJax.typesetPromise();
        }

        async function approveAndMove() {
            const q = stagingQueue[currentIndex];
            const btn = document.getElementById('app-btn');
            btn.innerText = "Processing..."; btn.disabled = true;

            try {
                const { data: dupCheck } = await supabaseClient.from('questions').select('id').eq('question_text', q.question_text).maybeSingle();
                if (dupCheck) {
                    alert("Collision detected. Block already exists in target environment. Discarding.");
                    await supabaseClient.from('staging_questions').delete().eq('id', q.id);
                    stagingQueue.splice(currentIndex, 1);
                    return updateUI();
                }

                btn.innerText = "Writing...";
                const { error: insErr } = await supabaseClient.from('questions').insert([{
                    subject: q.subject, question_text: q.question_text,
                    option_a: q.option_a, option_b: q.option_b, option_c: q.option_c, option_d: q.option_d,
                    correct_answer: q.correct_answer, short_id: q.short_id, year: q.year
                }]);
                if (insErr) throw insErr;

                const { error: delErr } = await supabaseClient.from('staging_questions').delete().eq('id', q.id);
                if (delErr) throw delErr;

                stagingQueue.splice(currentIndex, 1);
                updateUI();
                loadGlobalStats(); 
            } catch (err) { alert("Commit Error: " + err.message); } 
            finally { btn.innerHTML = "Commit to Database"; btn.disabled = false; }
        }

        async function deleteStagingQuestion() {
            const q = stagingQueue[currentIndex];
            const btn = document.getElementById('del-btn');
            btn.innerText = "Deleting..."; btn.disabled = true;
            try {
                const { error } = await supabaseClient.from('staging_questions').delete().eq('id', q.id);
                if (error) throw error;
                stagingQueue.splice(currentIndex, 1);
                updateUI();
            } catch (err) { alert("Deletion Error: " + err.message); } 
            finally { btn.innerHTML = "Discard Data"; btn.disabled = false; }
        }

        function updateUI() {
            document.getElementById('staging-count').innerText = stagingQueue.length;
            if (stagingQueue.length === 0) {
                document.getElementById('empty-state').style.display = 'block';
                document.getElementById('review-canvas').style.display = 'none';
            } else {
                if (currentIndex >= stagingQueue.length) currentIndex = 0; 
                renderStagingCard();
            }
        }

        async function searchMainDatabase() {
            const shortId = document.getElementById('search-id').value.toUpperCase().trim();
            const btn = document.getElementById('search-btn');
            const status = document.getElementById('search-status');
            
            if (!shortId || shortId.length < 4) { status.style.color = "#fca5a5"; status.innerText = "Invalid Hash Format."; return; }

            btn.innerText = "Scanning..."; btn.disabled = true; status.innerText = "";

            try {
                const { data, error } = await supabaseClient.from('questions').select('*').eq('short_id', shortId).maybeSingle();
                
                if (error) throw error;
                if (!data) {
                    status.style.color = "#fca5a5"; status.innerText = `Zero matches for Hash: ${shortId}`;
                    document.getElementById('editor-canvas').style.display = 'none';
                    return;
                }

                activeEditorQuestion = data;
                status.style.color = "#10b981"; status.innerText = "Target isolated successfully.";
                document.getElementById('editor-canvas').style.display = 'block';
                document.getElementById('edit-correct-option').value = data.correct_answer;
                
                renderEditorCard();

            } catch (err) {
                status.style.color = "#fca5a5"; status.innerText = "Error: " + err.message;
            } finally {
                btn.innerHTML = "Query Database"; btn.disabled = false;
            }
        }

        function renderEditorCard() {
            const q = activeEditorQuestion;
            const isCorrect = (opt) => q.correct_answer === opt ? 'correct-ans' : '';
            const html = `
                <div class="q-meta">
                    <span>${q.subject} // YR: ${q.year}</span>
                    <span style="background: rgba(255,255,255,0.1); padding: 4px 12px; border-radius: 6px; font-family: monospace;">HASH: ${q.short_id}</span>
                </div>
                <div class="q-text">${prepText(q.question_text)}</div>
                <div class="option-box ${isCorrect('A')}"><div class="opt-letter">A</div> <span class="opt-text">${prepText(q.option_a)}</span></div>
                <div class="option-box ${isCorrect('B')}"><div class="opt-letter">B</div> <span class="opt-text">${prepText(q.option_b)}</span></div>
                <div class="option-box ${isCorrect('C')}"><div class="opt-letter">C</div> <span class="opt-text">${prepText(q.option_c)}</span></div>
                <div class="option-box ${isCorrect('D')}"><div class="opt-letter">D</div> <span class="opt-text">${prepText(q.option_d)}</span></div>
            `;
            document.getElementById('editor-q-card').innerHTML = html;
            if (window.MathJax) MathJax.typesetPromise();
        }

        async function updateMainAnswer() {
            if(!activeEditorQuestion) return;
            const newAns = document.getElementById('edit-correct-option').value;
            const btn = document.getElementById('edit-update-btn');
            
            btn.innerText = "Overwriting..."; btn.disabled = true;

            try {
                const { data, error } = await supabaseClient.from('questions')
                    .update({ correct_answer: newAns })
                    .eq('id', activeEditorQuestion.id)
                    .select();

                if (error) throw error;
                if (!data || data.length === 0) {
                    throw new Error("Mutation blocked by Row Level Security.");
                }
                
                alert(`System updated. Pointer set to ${newAns}`);
                activeEditorQuestion.correct_answer = newAns;
                renderEditorCard(); 
            } catch (err) { alert("Mutation Error: " + err.message); } 
            finally { btn.innerHTML = "Save Mutation"; btn.disabled = false; }
        }

        async function deleteMainQuestion() {
            if(!activeEditorQuestion) return;
            if(!confirm("CRITICAL WARNING: This will permanently purge the block from the live database. Proceed?")) return;
            
            const btn = document.getElementById('edit-del-btn');
            btn.innerText = "Purging..."; btn.disabled = true;

            try {
                const { data, error } = await supabaseClient.from('questions')
                    .delete()
                    .eq('id', activeEditorQuestion.id)
                    .select();

                if (error) throw error;
                if (!data || data.length === 0) {
                    throw new Error("Purge blocked by Row Level Security.");
                }
                
                alert("Block purged successfully.");
                document.getElementById('editor-canvas').style.display = 'none';
                document.getElementById('search-id').value = '';
                document.getElementById('search-status').innerText = '';
                activeEditorQuestion = null;
                loadGlobalStats(); 
            } catch (err) { alert("Purge Error: " + err.message); } 
            finally { btn.innerHTML = "Obliterate Record"; btn.disabled = false; }
        }
    </script>
</body>
</html>
