<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Results - Brightsitedev CBT</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/main.css">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body { background-color: #f8fafc; color: #0f172a; margin: 0; padding: 0; }
        
        .result-nav {
            height: 70px; background: white; 
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 5%; border-bottom: 1px solid #e2e8f0;
        }

        .result-wrapper {
            max-width: 1200px; margin: 3rem auto; padding: 0 2rem;
            display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;
        }

        /* LEFT SIDE: Aggregate Display */
        .aggregate-panel {
            background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
            border-radius: 24px; padding: 4rem 2rem; text-align: center; color: white;
            box-shadow: 0 25px 50px -12px rgba(30, 58, 138, 0.25);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .score-circle {
            width: 200px; height: 200px; border-radius: 50%;
            background: rgba(255,255,255,0.1); border: 8px solid #3b82f6;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            margin-bottom: 2rem; box-shadow: 0 0 30px rgba(59, 130, 246, 0.3);
        }

        .score-circle h1 { font-size: 3.5rem; margin: 0; font-weight: 800; line-height: 1; }
        .score-circle span { font-size: 1rem; color: #93c5fd; font-weight: 600; margin-top: 5px; }

        /* RIGHT SIDE: Breakdown & Math */
        .breakdown-panel {
            background: white; border-radius: 24px; padding: 3rem;
            border: 1px solid #e2e8f0; box-shadow: 0 10px 30px -5px rgba(0,0,0,0.05);
        }

        .math-box {
            background: #f1f5f9; border-radius: 16px; padding: 1.5rem;
            margin-bottom: 1.5rem; border-left: 5px solid #2563eb;
        }
        
        .math-row {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 1.1rem; padding: 0.5rem 0; border-bottom: 1px solid #e2e8f0;
        }
        .math-row:last-child { border-bottom: none; }
        .math-label { color: #64748b; font-weight: 600; }
        .math-value { font-weight: 800; color: #0f172a; }

        .subject-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 2rem;
        }

        .subject-card {
            background: white; border: 1px solid #e2e8f0; border-radius: 12px;
            padding: 1rem; text-align: center;
        }
        .subject-card h4 { margin: 0 0 5px 0; color: #64748b; font-size: 0.85rem; text-transform: uppercase; }
        .subject-card p { margin: 0; font-size: 1.5rem; font-weight: 800; color: #2563eb; }

        .action-btn {
            display: block; width: 100%; background: #0f172a; color: white;
            text-align: center; padding: 1.2rem; border-radius: 12px; font-weight: 700;
            text-decoration: none; margin-top: 2rem; transition: transform 0.2s; border: none; cursor: pointer;
        }
        .action-btn:hover { transform: translateY(-2px); }

        /* MOBILE RESPONSIVENESS */
        @media (max-width: 900px) {
            .result-wrapper { grid-template-columns: 1fr; padding: 0 1rem; margin: 2rem auto; }
            .aggregate-panel { padding: 3rem 1.5rem; }
            .breakdown-panel { padding: 2rem 1.5rem; }
            .subject-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav class="result-nav">
        <div style="font-weight: 800; font-size: 1.2rem; color: #1e293b;">Brightsitedev CBT</div>
        <div style="color: #64748b; font-weight: 600;" id="status-badge">Processing Results...</div>
    </nav>

    <div class="result-wrapper">
        <div class="aggregate-panel">
            <h2 style="margin-top: 0; font-size: 1.5rem; color: #93c5fd;">Admission Aggregate</h2>
            <div class="score-circle">
                <h1 id="ui-aggregate">--</h1>
                <span>out of 100%</span>
            </div>
            <p style="color: #bfdbfe; font-size: 1.1rem; max-width: 300px; line-height: 1.6;">
                Your final score combines your JAMB result (divided by 8) and your Post-UTME performance.
            </p>
        </div>

        <div class="breakdown-panel">
            <h2 style="margin-top: 0; margin-bottom: 1.5rem; font-size: 1.8rem;">Calculation Breakdown</h2>
            
            <div class="math-box">
                <div class="math-row">
                    <span class="math-label">JAMB Score Provided</span>
                    <span class="math-value" id="ui-jamb-raw">--</span>
                </div>
                <div class="math-row">
                    <span class="math-label">JAMB Weight (Score ÷ 8)</span>
                    <span class="math-value" id="ui-jamb-weight">--</span>
                </div>
                <div class="math-row" style="margin-top: 10px;">
                    <span class="math-label">Post-UTME Score</span>
                    <span class="math-value" style="color: #16a34a;" id="ui-putme-score">-- / 50</span>
                </div>
            </div>

            <h3 style="margin-bottom: 10px; color: #0f172a;">Subject Performance</h3>
            <div class="subject-grid" id="subject-container">
                </div>

            <button class="action-btn" onclick="window.location.href='../dashboard/index.html'">Return to Dashboard</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../static/app.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            
            // 1. Grab exam data from local storage
            const rawExamData = localStorage.getItem('cbt_recent_exam');
            if (!rawExamData) {
                alert("No recent exam data found.");
                window.location.href = '../dashboard/index.html';
                return;
            }
            
            const examData = JSON.parse(rawExamData);
            
            // 2. Authenticate & Fetch Profile for JAMB Score
            const { data: { session }, error: authError } = await supabaseClient.auth.getSession();
            if (!session || authError) return window.location.href = '../login/index.html';

            const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
            
            // 3. THE MATHEMATICS ENGINE
            const totalQuestions = examData.totalQuestions || 40;
            const correctAnswers = examData.correctCount || 0;
            
            // Scale Post-UTME to be strictly out of 50
            const rawPostUtme = (correctAnswers / totalQuestions) * 50;
            const postUtmeScore = parseFloat(rawPostUtme.toFixed(1));

            // JAMB Calculation
            const jambScore = profile.jamb_score || 0; // Fallback to 0 if they bypassed it
            const jambWeight = parseFloat((jambScore / 8).toFixed(1));

            // Final Formula Fusion
            const finalAggregate = (jambWeight + postUtmeScore).toFixed(1);

            // 4. UPDATE THE UI
            document.getElementById('ui-aggregate').innerText = finalAggregate + '%';
            document.getElementById('ui-jamb-raw').innerText = jambScore;
            document.getElementById('ui-jamb-weight').innerText = jambWeight + ' pts';
            document.getElementById('ui-putme-score').innerText = postUtmeScore + ' / 50';

            // Populate Subject Grid dynamically
            const subContainer = document.getElementById('subject-container');
            for (const [subject, score] of Object.entries(examData.breakdown)) {
                if (score > 0 || ['english', 'mathematics'].includes(subject)) { // Only show subjects they actually took
                    const div = document.createElement('div');
                    div.className = 'subject-card';
                    div.innerHTML = `<h4>${subject}</h4><p>${score}</p>`;
                    subContainer.appendChild(div);
                }
            }

            // Trigger Premium Confetti Celebration
            confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 }, colors: ['#2563eb', '#3b82f6', '#93c5fd'] });

            // 5. SAVE TO SUPABASE DATABASE
            document.getElementById('status-badge').innerText = 'Saving to Database...';

            // Push to Results Table
            await supabaseClient.from('results').insert({
                student_id: session.user.id,
                total_score: postUtmeScore, // Saving the /50 score for dashboard history
                english_score: examData.breakdown.english || 0,
                math_score: examData.breakdown.mathematics || 0,
                physics_score: examData.breakdown.physics || 0,
                chemistry_score: examData.breakdown.chemistry || 0
                // Note: If you added columns for commerce/literature to Supabase, add them here!
            });

            // Increment tests taken in Profiles table
            await supabaseClient.from('profiles').update({ 
                tests_taken: (profile.tests_taken || 0) + 1 
            }).eq('id', session.user.id);

            document.getElementById('status-badge').innerText = 'Results Saved ✓';
            document.getElementById('status-badge').style.color = '#10b981';

            // 6. Security: Wipe local storage so they can't refresh and save duplicate scores
            localStorage.removeItem('cbt_recent_exam');
            localStorage.removeItem('cbt_user_answers');
        });
    </script>
</body>
</html>
