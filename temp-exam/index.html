<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin QA Review - AFIT CBT Simulator</title>
    <link rel="icon" type="image/svg+xml" href="../static/img/afitcbtsim-logo.svg">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/main.css">
    
    <!-- 🚀 MATHJAX CONFIGURATION -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre'] }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        body.exam-mode {
            background-color: #f8fafc; color: #0f172a; margin: 0; height: 100vh; overflow: hidden;
            font-family: 'Poppins', sans-serif;
        }
        
        .exam-layout { display: flex; flex-direction: column; height: 100vh; display: none; }
        
        .exam-nav {
            height: 70px; background: #0f172a; color: white; display: flex; justify-content: space-between; align-items: center;
            padding: 0 5%; flex-shrink: 0; z-index: 10;
        }
        
        /* 🚀 STRICT INDEPENDENT SCROLLING LAYOUT */
        .exam-main { 
            display: grid; 
            grid-template-columns: 320px 1fr; 
            height: calc(100vh - 70px); 
            overflow: hidden; 
        }
        
        .nav-sidebar { 
            background: #f1f5f9; border-right: 1px solid #e2e8f0; 
            display: flex; flex-direction: column; 
            padding: 1.5rem; 
            height: 100%; overflow: hidden; 
        }
        
        .admin-controls { 
            background: white; padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; 
            border: 1px solid #cbd5e1; flex-shrink: 0; 
        }
        .admin-controls select { width: 100%; padding: 0.5rem; margin-bottom: 10px; border-radius: 6px; border: 1px solid #cbd5e1; font-family: 'Poppins'; }
        .admin-controls button { width: 100%; background: #2563eb; color: white; border: none; padding: 0.8rem; border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        /* The numbers grid gets its own isolated scrollbar */
        .grid-status { 
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; 
            overflow-y: auto; padding-right: 5px; padding-bottom: 2rem; 
            flex-grow: 1; align-content: start;
        }
        
        .q-dot {
            aspect-ratio: 1; border-radius: 8px; background: white; color: #64748b;
            display: flex; justify-content: center; align-items: center; font-weight: 700; font-size: 0.85rem; cursor: pointer; border: 1px solid #cbd5e1;
        }
        .q-dot.active { border: 2px solid #2563eb; background: #eff6ff; color: #2563eb; }

        /* The question side gets its own isolated scrollbar */
        .question-canvas { 
            padding: 0 5% 3rem 5%; overflow-y: auto; 
            display: flex; flex-direction: column; align-items: center; 
            background: #f8fafc; height: 100%; 
        }
        
        .question-card { 
            background: white; padding: 0 3rem 3rem 3rem; border-radius: 20px; 
            width: 100%; max-width: 900px; border: 1px solid #e2e8f0; 
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.05); margin-top: 3rem; position: relative;
        }
        
        /* 🚀 STICKY HEADER: Keeps the Delete Button visible when scrolling down */
        .q-meta { 
            position: sticky; top: 0; background: white; z-index: 10;
            padding: 3rem 0 1rem 0; margin-bottom: 1.5rem; 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 2px solid #f1f5f9; 
        }
        
        .db-id-badge { background: #fef2f2; color: #dc2626; padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.8rem; font-weight: 800; cursor: pointer; border: 1px solid #fca5a5; transition: all 0.2s;}
        .db-id-badge:hover { background: #dc2626; color: white; }
        
        .q-text { font-size: 1.25rem; line-height: 1.7; font-weight: 500; margin-bottom: 2.5rem; color: #1e293b; }
        .option-box { display: flex; align-items: center; padding: 1.2rem 1.5rem; background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px; margin-bottom: 1rem; }
        .option-box.correct-ans { background: #dcfce7; border-color: #16a34a; }
        .opt-letter { width: 32px; height: 32px; border-radius: 50%; background: #e2e8f0; flex-shrink: 0; display: flex; justify-content: center; align-items: center; font-weight: 800; margin-right: 15px; color: #475569; }
        .option-box.correct-ans .opt-letter { background: #16a34a; color: white; }
        .opt-text { font-size: 1.05rem; color: #334155; }

        .controls { display: flex; gap: 15px; width: 100%; max-width: 900px; margin-top: 2rem; justify-content: space-between;}
        .btn-exam { padding: 1rem 2rem; border-radius: 10px; font-weight: 700; cursor: pointer; border: none; font-size: 1rem;}
        .btn-prev { background: #e2e8f0; color: #475569; }
        .btn-next { background: #2563eb; color: white; }
    </style>
</head>
<body class="exam-mode">

    <div id="exam-layout" class="exam-layout">
        <nav class="exam-nav">
            <div style="font-weight: 800; font-size: 1.2rem; color: white;">AFIT CBT | Admin Quality Assurance</div>
            <div style="font-size: 0.9rem; font-weight: 500; color: #94a3b8;" id="total-loaded">0 Questions Loaded</div>
        </nav>

        <main class="exam-main">
            <aside class="nav-sidebar">
                <div class="admin-controls">
                    <label style="font-size: 0.8rem; font-weight: bold; color: #475569; display: block; margin-bottom: 5px;">SELECT SUBJECT</label>
                    <select id="subject-filter">
                        <option value="english">English</option>
                        <option value="mathematics">Mathematics</option>
                        <option value="physics">Physics</option>
                        <option value="chemistry">Chemistry</option>
                        <option value="gns">GNS</option>
                        <option value="economics">Economics</option>
                        <option value="government">Government</option>
                        <option value="literature">Literature</option>
                        <option value="commerce">Commerce</option>
                    </select>
                    <button onclick="fetchQuestionsForReview()" id="load-btn">Load Database</button>
                </div>
                
                <div class="grid-status" id="dot-grid"></div>
            </aside>

            <section class="question-canvas">
                <div id="loading-state" style="font-size: 1.1rem; color: #64748b; margin-top: 3rem; text-align: center;">
                    <p>Select a subject and click Load.</p>
                </div>
                
                <div id="q-card" class="question-card" style="display: none;">
                    <div class="q-meta">
                        <span id="q-subject-text" style="color: #2563eb; font-size: 1rem;">SUBJECT</span>
                        <button class="db-id-badge" onclick="deleteCurrentQuestion()">🗑️ Delete Question</button>
                    </div>
                    
                    <div class="q-text" id="q-body"></div>

                    <div id="options-stack">
                        <div class="option-box" id="box-A"><div class="opt-letter">A</div> <span class="opt-text" id="text-A"></span></div>
                        <div class="option-box" id="box-B"><div class="opt-letter">B</div> <span class="opt-text" id="text-B"></span></div>
                        <div class="option-box" id="box-C"><div class="opt-letter">C</div> <span class="opt-text" id="text-C"></span></div>
                        <div class="option-box" id="box-D"><div class="opt-letter">D</div> <span class="opt-text" id="text-D"></span></div>
                    </div>
                </div>

                <div class="controls" id="control-bar" style="display: none;">
                    <button class="btn-exam btn-prev" onclick="move(-1)">← Previous</button>
                    <button class="btn-exam btn-next" onclick="move(1)">Next Question →</button>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../static/app.js"></script>

    <script>
        let questions = [];
        let index = 0;

        // ADMIN FAILSAFE
        if (typeof supabaseClient === 'undefined') {
            const supabaseUrl = 'PASTE_YOUR_SUPABASE_URL_HERE';
            const supabaseKey = 'PASTE_YOUR_SUPABASE_ANON_KEY_HERE';
            window.supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const { data: { session }, error: authError } = await supabaseClient.auth.getSession();
            if (!session) return window.location.href = '../login/index.html';

            const { data: profile } = await supabaseClient.from('profiles').select('role').eq('id', session.user.id).single();
            if (!profile || profile.role !== 'admin') {
                alert("ACCESS DENIED: QA Portal is for administrators only.");
                window.location.href = '../dashboard/index.html';
                return;
            }

            document.getElementById('exam-layout').style.display = 'flex';
        });

        // 🚀 THE ULTIMATE UNIVERSAL MOJIBAKE DECODER
        const MOJIBAKE_MAP = {
            "a\u0161": "\\sqrt{", "â€²â€²": "-", "âr′": "-", "\\l_s": "\\theta", "\\l,": "\\theta", "i\\in": "\\pi", "Î\\_s": "\\theta",
            "kgmal": "kgm^{-3}", "Nma 2": "Nm^{-2}", "msâˆ’1": "ms^{-1}", "msâˆ’2": "ms^{-2}",
            "â€™": "'", "â€˜": "'", "â€œ": '"', "â€": '"', "â€": '"', "â€š": "‚", "â€ž": "„", "â€“": "-", "â€”": "-", "â€¦": "...", "â€¢": "•",
            "â‚¬": "€", "Â£": "£", "â‚¦": "₦", "âˆ’": "−", "â‰¡": "≡", "â‰ˆ": "≈", "âˆ¼": "∼", "âˆ": "∝", "âˆ«": "∫", "âˆ‘": "∑", "âˆЏ": "∏", "âˆ†": "Δ", "âˆ‡": "∇",
            "âˆˆ": "∈", "âˆ‰": "∉", "âˆ©": "∩", "âˆª": "∪", "âˆ´": "∴", "âˆµ": "∵", "âˆ—": "∗", "âˆ˜": "∘", "âŠ‚": "⊂", "âŠƒ": "⊃", "âŠ†": "⊆", "âŠ‡": "⊇",
            "âŠ•": "⊕", "âŠ—": "⊗", "âŠ¥": "⊥", "â‹…": "⋅", "Ã—": "×", "Ã·": "÷", "Â°": "°", "Â±": "±", "â‰ ": "≠", "â‰¤": "≤", "â‰¥": "≥", "âˆž": "∞", "âˆš": "√",
            "Â²": "^2", "Â³": "^3", "Â¹": "^1", "Â¼": "¼", "Â½": "½", "Â¾": "¾", "â†’": "→", "â‡Œ": "⇌", "â†": "←", "â†‘": "↑", "â†“": "↓", "â†”": "↔",
            "â‡’": "⇒", "â‡": "⇐", "â‡‘": "⇑", "â‡“": "⇓", "â‡”": "⇔",
            "Î±": "α", "Î²": "β", "Î³": "γ", "Î´": "δ", "Îµ": "ε", "Î¶": "ζ", "Î·": "η", "Î¸": "θ", "Î¹": "ι", "Îº": "κ", "Î»": "λ", "Î¼": "μ", "Âµ": "μ",
            "Î½": "ν", "Î¾": "ξ", "Î¿": "ο", "Ï€": "π", "Ï": "ρ", "Ï‚": "ς", "Ïƒ": "σ", "Ï„": "τ", "Ï…": "υ", "Ï†": "φ", "Ï‡": "χ", "Ïˆ": "ψ", "Ï‰": "ω", "Â": " " 
        };
        const MOJIBAKE_KEYS = Object.keys(MOJIBAKE_MAP).sort((a, b) => b.length - a.length);

        function prepText(txt) {
            if (!txt) return "";
            let c = txt;
            for (let i = 0; i < MOJIBAKE_KEYS.length; i++) {
                c = c.split(MOJIBAKE_KEYS[i]).join(MOJIBAKE_MAP[MOJIBAKE_KEYS[i]]);
            }
            const mathCommands = ['\\frac', '\\theta', '\\pi', '\\sqrt', '\\alpha', '\\beta', '\\int', '\\sum', '\\sin', '\\cos', '\\tan', '^'];
            const hasMath = mathCommands.some(cmd => c.includes(cmd));
            const hasDelimiters = c.includes('$') || c.includes('\\(') || c.includes('\\[');
            if (hasMath && !hasDelimiters) c = '\\( ' + c + ' \\)';
            return c;
        }

        async function fetchQuestionsForReview() {
            const btn = document.getElementById('load-btn');
            btn.innerText = "Loading...";
            btn.disabled = true;
            
            const subj = document.getElementById('subject-filter').value;
            document.getElementById('loading-state').style.display = 'block';
            document.getElementById('loading-state').innerHTML = `<p>Fetching all ${subj} questions from database...</p>`;
            document.getElementById('q-card').style.display = 'none';
            document.getElementById('control-bar').style.display = 'none';

            try {
                const { data, error } = await supabaseClient
                    .from('questions')
                    .select('*')
                    .ilike('subject', `%${subj}%`)
                    .limit(1000);

                if (error) throw error;

                if (!data || data.length === 0) {
                    alert(`No questions found for ${subj}.`);
                    btn.innerText = "Load Database";
                    btn.disabled = false;
                    return;
                }

                questions = data;
                index = 0;
                document.getElementById('total-loaded').innerText = `${questions.length} Questions Loaded`;
                
                buildGrid();
                render();
                
                document.getElementById('loading-state').style.display = 'none';
                document.getElementById('q-card').style.display = 'block';
                document.getElementById('control-bar').style.display = 'flex';

            } catch (err) {
                console.error(err);
                alert("Error fetching database.");
            }
            
            btn.innerText = "Load Database";
            btn.disabled = false;
        }

        function buildGrid() {
            const container = document.getElementById('dot-grid');
            container.innerHTML = '';
            questions.forEach((_, i) => {
                const d = document.createElement('div');
                d.className = 'q-dot';
                d.id = `dot-${i}`;
                d.innerText = i + 1;
                d.onclick = () => { index = i; render(); };
                container.appendChild(d);
            });
        }

        function render() {
            if(questions.length === 0) {
                document.getElementById('q-card').style.display = 'none';
                document.getElementById('control-bar').style.display = 'none';
                document.getElementById('total-loaded').innerText = `0 Questions Loaded`;
                document.getElementById('dot-grid').innerHTML = '';
                return;
            }

            const q = questions[index];
            
            document.getElementById('q-subject-text').innerText = `[ID: ${q.id} | Code: ${q.short_id || 'N/A'}] ${(q.subject || "Subject").toUpperCase()} • Q${index + 1} of ${questions.length}`;
            
            document.getElementById('q-body').innerText = prepText(q.question_text);
            document.getElementById('text-A').innerText = prepText(q.option_a);
            document.getElementById('text-B').innerText = prepText(q.option_b);
            document.getElementById('text-C').innerText = prepText(q.option_c);
            document.getElementById('text-D').innerText = prepText(q.option_d || q.option_D);
            
            ['A', 'B', 'C', 'D'].forEach(opt => document.getElementById(`box-${opt}`).classList.remove('correct-ans'));
            let correctOpt = q.correct_answer || q.answer;
            if (correctOpt) {
                let box = document.getElementById(`box-${correctOpt.trim().toUpperCase()}`);
                if(box) box.classList.add('correct-ans');
            }

            document.querySelectorAll('.q-dot').forEach(d => d.classList.remove('active'));
            const activeDot = document.getElementById(`dot-${index}`);
            if(activeDot) {
                activeDot.classList.add('active');
                activeDot.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }

            if (window.MathJax) MathJax.typesetPromise();
        }

        function move(dir) {
            if (index + dir >= 0 && index + dir < questions.length) {
                index += dir;
                render();
            }
        }

        async function deleteCurrentQuestion() {
            const q = questions[index];
            if(!confirm(`Are you sure you want to permanently delete this question from the database?\n\nID: ${q.id} | Code: ${q.short_id || 'N/A'}`)) return;

            try {
                const { data, error } = await supabaseClient
                    .from('questions')
                    .delete()
                    .eq('id', q.id)
                    .select();

                if (error) throw error;
                
                if (!data || data.length === 0) {
                    throw new Error("RLS Blocked: You do not have database permission to delete this.");
                }
                
                questions.splice(index, 1);
                
                if (index >= questions.length && index > 0) index--;
                
                document.getElementById('total-loaded').innerText = `${questions.length} Questions Loaded`;
                
                buildGrid();
                render();

            } catch (err) {
                console.error(err);
                alert("Failed to delete question: " + (err.message || "Check console."));
            }
        }
    </script>
</body>
</html>
