<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wall of Love - AFIT CBT Simulator</title>
    
    <link rel="icon" type="image/svg+xml" href="../static/img/afitcbtsim-logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/main.css">

    <style>
        html, body { max-width: 100vw; overflow-x: hidden; margin: 0; padding: 0; }
        *, *::before, *::after { box-sizing: border-box; }

        body { 
            background-color: #f8fafc;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 30px 30px;
            color: #0f172a; font-family: 'Poppins', sans-serif; 
            min-height: 100vh;
        }

        .nav-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.2rem 5%; background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px); border-bottom: 1px solid #e2e8f0;
            position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }

        .nav-logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.1rem; color: #0f172a; letter-spacing: -0.5px;}
        .nav-logo img { width: 32px; height: 32px; border-radius: 8px; box-shadow: 0 4px 10px rgba(37,99,235,0.2);}

        .btn-back {
            background: #2563eb; color: white; border: none;
            padding: 0.6rem 1.2rem; border-radius: 10px; font-weight: 700; cursor: pointer;
            transition: all 0.2s; font-family: 'Poppins', sans-serif; font-size: 0.9rem;
            display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
        }
        .btn-back:hover { background: #1d4ed8; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(37, 99, 235, 0.3); }

        .main-container { max-width: 1200px; margin: 0 auto; padding: 4rem 1.5rem; text-align: center; }

        .hero-title { font-size: 2.8rem; font-weight: 900; margin: 0 0 10px 0; letter-spacing: -1px; color: #0f172a; }
        .hero-subtitle { color: #64748b; font-size: 1.1rem; font-weight: 500; margin: 0 0 3.5rem 0; line-height: 1.6; }

        /* 🚀 MASONRY GRID FOR REVIEWS */
        .reviews-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px;
            align-items: start; animation: fadeSlideUp 0.6s ease forwards;
        }

        .review-card {
            background: white; border-radius: 20px; padding: 2rem; color: #0f172a; text-align: left;
            box-shadow: 0 15px 35px -10px rgba(0,0,0,0.05); border: 1px solid #e2e8f0;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .review-card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px -10px rgba(0,0,0,0.08); border-color: #cbd5e1;}

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
        
        .student-info { display: flex; align-items: center; gap: 12px; }
        .avatar-circle {
            width: 45px; height: 45px; border-radius: 50%; background: linear-gradient(135deg, #2563eb, #38bdf8);
            color: white; display: flex; justify-content: center; align-items: center;
            font-weight: 800; font-size: 1.1rem; flex-shrink: 0; box-shadow: 0 4px 10px rgba(37,99,235,0.2);
        }
        .s-name { font-weight: 800; font-size: 1.05rem; margin: 0 0 2px 0; color: #1e293b;}
        .s-course { font-size: 0.75rem; color: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;}

        .score-pill {
            background: #f0fdf4; border: 1px solid #bbf7d0; color: #16a34a; padding: 4px 10px;
            border-radius: 8px; font-weight: 800; font-size: 0.8rem; white-space: nowrap;
        }

        .star-row { display: flex; gap: 2px; color: #fbbf24; margin-bottom: 1rem; }
        .star-row svg { width: 18px; height: 18px; fill: currentColor; }

        .r-text { font-size: 0.95rem; color: #334155; line-height: 1.6; font-weight: 500; margin: 0; }

        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 650px) {
            .nav-header { padding: 1rem; }
            .main-container { padding: 2.5rem 1rem; }
            .hero-title { font-size: 2.2rem; }
            .reviews-grid { grid-template-columns: 1fr; gap: 15px;}
            .review-card { padding: 1.5rem; }
        }
    </style>
</head>
<body>

    <nav class="nav-header">
        <div class="nav-logo">
            <img src="../static/img/afitcbtsim-logo.png" alt="Logo">
            AFIT CBT SIM
        </div>
        <!-- 🚀 FIXED: Routes to Dashboard instead of Landing Page -->
        <button onclick="window.location.href='../dashboard/index.html'" class="btn-back">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
            Dashboard
        </button>
    </nav>

    <div class="main-container">
        
        <h1 class="hero-title">Wall of Love</h1>
        <p class="hero-subtitle">See what successful AFIT aspirants have to say about the CBT Simulator.</p>

        <div id="loading-spinner" style="padding: 4rem 0;">
            <svg class="animate-spin" style="width: 45px; height: 45px; color: #2563eb; margin: 0 auto 15px auto; display: block;" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <h3 style="color: #64748b; font-weight: 600;">Loading reviews...</h3>
        </div>

        <div id="reviews-container" class="reviews-grid" style="display: none;">
            <!-- Reviews injected here -->
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../static/app.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            if (typeof supabaseClient === 'undefined') {
                const supabaseUrl = 'PASTE_YOUR_SUPABASE_URL_HERE';
                const supabaseKey = 'PASTE_YOUR_SUPABASE_ANON_KEY_HERE';
                window.supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
            }

            try {
                // Fetch reviews ordered by newest first
                const { data, error } = await supabaseClient
                    .from('platform_reviews')
                    .select('*')
                    .order('submitted_at', { ascending: false });

                if (error) throw error;

                const container = document.getElementById('reviews-container');
                const loader = document.getElementById('loading-spinner');

                if (!data || data.length === 0) {
                    loader.innerHTML = `
                        <h2 style="color: #0f172a; margin-bottom: 5px;">No reviews yet.</h2>
                        <p style="color: #64748b;">Be the first to share your success story!</p>
                    `;
                    return;
                }

                loader.style.display = 'none';
                container.style.display = 'grid';

                let html = "";
                data.forEach((review) => {
                    const initials = review.full_name.trim().split(/\s+/).map(n => n[0]).join('').substring(0, 2).toUpperCase();
                    
                    let stars = "";
                    for(let i=0; i<5; i++) {
                        if (i < review.rating) {
                            stars += `<svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;
                        } else {
                            stars += `<svg viewBox="0 0 24 24" style="color: #e2e8f0;"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;
                        }
                    }

                    const scoreHtml = review.putme_score ? `<div class="score-pill">Score: ${review.putme_score}/100</div>` : '';

                    html += `
                        <div class="review-card">
                            <div class="card-header">
                                <div class="student-info">
                                    <div class="avatar-circle">${initials}</div>
                                    <div>
                                        <p class="s-name">${review.full_name}</p>
                                        <p class="s-course">${review.course}</p>
                                    </div>
                                </div>
                                ${scoreHtml}
                            </div>
                            <div class="star-row">${stars}</div>
                            <p class="r-text">"${review.review_text.replace(/</g, "&lt;").replace(/>/g, "&gt;")}"</p>
                        </div>
                    `;
                });

                container.innerHTML = html;

            } catch (err) {
                console.error("Error fetching reviews:", err);
                document.getElementById('loading-spinner').innerHTML = `<h3 style="color: #ef4444;">Failed to load reviews. Please try again.</h3>`;
            }
        });
    </script>
</body>
</html>
